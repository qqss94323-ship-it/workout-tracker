<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HOMEGYM 4-SPLIT TRACKER</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --box: #222731;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --border: #2d3340;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 12px 12px 115px 12px; max-width: 660px; margin: 0 auto; line-height: 1.45; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
    .title { font-size: 1.15rem; font-weight: 800; color: #fff; }
    .sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .cycle-badge { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 4px 9px; border-radius: 6px; font-size: 0.76rem; font-weight: 700; display: inline-block; }

    /* 5개 탭 (당직휴식 + 4분할) */
    .day-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 14px; }
    .tab { padding: 9px 4px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 0.76rem; font-weight: 700; color: var(--muted); cursor: pointer; line-height: 1.25; }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .tab.rest-tab.active { background: var(--green); color: #052e16; border-color: var(--green); }

    /* 운동 카드 */
    .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .ex-card.done-card { border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.05); }
    .ex-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .ex-name { font-size: 0.98rem; font-weight: 700; color: #fff; }
    .ex-rest-tag { font-size: 0.74rem; padding: 3px 7px; border-radius: 4px; background: var(--box); color: var(--amber); font-weight: 600; white-space: nowrap; }
    .ex-target { font-size: 0.88rem; font-weight: 700; color: #60a5fa; margin-bottom: 5px; }
    .ex-plate { font-size: 0.76rem; color: #34d399; background: rgba(16, 185, 129, 0.1); padding: 5px 8px; border-radius: 5px; margin-bottom: 8px; display: inline-block; font-weight: 600; }
    .ex-note { font-size: 0.76rem; color: var(--muted); margin-bottom: 10px; }

    /* 세트 버튼 그리드 */
    .set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(82px, 1fr)); gap: 7px; }
    .set-btn { padding: 10px 6px; background: var(--box); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.8rem; font-weight: 700; text-align: center; cursor: pointer; transition: 0.15s; user-select: none; }
    .set-btn.completed { background: var(--green); border-color: var(--green); color: #052e16; }
    .set-btn span { display: block; font-size: 0.7rem; font-weight: 500; opacity: 0.85; margin-top: 2px; }

    /* 완료 및 점진적 과부하 박스 */
    .finish-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; text-align: center; margin-top: 14px; }
    .progress-status { font-size: 0.86rem; font-weight: 700; margin-bottom: 10px; color: var(--muted); }
    .btn-finish { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 0.92rem; font-weight: 800; cursor: pointer; background: var(--box); color: var(--muted); transition: 0.2s; }
    .btn-finish.ready { background: var(--green); color: #052e16; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }

    details { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
    summary { font-size: 0.86rem; font-weight: 700; cursor: pointer; color: var(--text); }
    .simple-list { margin-top: 10px; font-size: 0.78rem; color: var(--muted); }
    .simple-list div { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    /* 하단 고정 타이머 바 */
    .timer-dock { position: fixed; bottom: 0; left: 0; right: 0; background: #14171f; border-top: 2px solid var(--border); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; max-width: 660px; margin: 0 auto; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.6); }
    .timer-dock.running { border-top-color: var(--amber); }
    .timer-dock.finished { border-top-color: var(--green); background: #0c261c; }
    .timer-left { display: flex; align-items: center; gap: 10px; }
    .timer-time { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--amber); min-width: 72px; }
    .timer-label { font-size: 0.76rem; color: var(--muted); line-height: 1.25; }
    .timer-controls { display: flex; gap: 5px; }
    .t-btn { padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--box); color: var(--text); font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .t-btn.stop { background: var(--red); border-color: var(--red); color: #fff; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div>
      <div class="title">HOMEGYM 4-SPLIT TRACKER</div>
      <div class="sub">출근 휴식 · 비번 4분할 (밀기 / 하체 / 어깨·팔 / 당기기)</div>
    </div>
    <div style="text-align:right;">
      <div class="cycle-badge" id="cycleBadge">6일 사이클 #1</div>
      <div style="margin-top:4px; display:flex; gap:5px; justify-content:flex-end;">
        <button class="t-btn" style="padding:3px 6px; font-size:0.68rem;" onclick="toggleMicroPlate()" id="microBtn">1.25kg원판: 보유</button>
        <button class="t-btn" style="padding:3px 6px; font-size:0.68rem;" onclick="resetAll()">초기화</button>
      </div>
    </div>
  </header>

  <!-- 5개 탭 (당직 휴식 + Day 1~4) -->
  <div class="day-tabs">
    <div class="tab rest-tab" id="tab-rest" onclick="selectDay('rest')">당직출근<br><span style="font-size:0.66rem; font-weight:500;">완전휴식</span></div>
    <div class="tab active" id="tab-d1" onclick="selectDay('d1')">Day 1<br><span style="font-size:0.66rem; font-weight:500;">비번1·밀기</span></div>
    <div class="tab" id="tab-d2" onclick="selectDay('d2')">Day 2<br><span style="font-size:0.66rem; font-weight:500;">비번2·하체</span></div>
    <div class="tab" id="tab-d3" onclick="selectDay('d3')">Day 3<br><span style="font-size:0.66rem; font-weight:500;">비번1·어깨팔</span></div>
    <div class="tab" id="tab-d4" onclick="selectDay('d4')">Day 4<br><span style="font-size:0.66rem; font-weight:500;">비번2·당기기</span></div>
  </div>

  <!-- 운동 리스트 렌더링 영역 -->
  <main id="workoutContainer"></main>

  <!-- 완료 및 점진적 과부하 트리거 -->
  <section class="finish-box">
    <div class="progress-status" id="progressStatus">진행률: 0 / 0 세트 완료</div>
    <button class="btn-finish" id="finishBtn" onclick="completeSessionAndOverload()">
      모든 세트를 체크하면 점진적 과부하가 활성화됩니다
    </button>
    <button class="t-btn" style="margin-top:8px; width:100%;" onclick="completeWithoutOverload()">
      오늘은 중량/횟수 유지하고 다음 세션으로 넘어가기
    </button>
  </section>

  <!-- 당일 수면·영양 요약 -->
  <details>
    <summary>오늘의 수면·식단 핵심 수칙 보기 (터치)</summary>
    <div class="simple-list" id="dailyGuideList"></div>
  </details>

  <!-- 하단 고정 자동 휴식 타이머 -->
  <div class="timer-dock" id="timerDock">
    <div class="timer-left">
      <div class="timer-time" id="timerDisplay">00:00</div>
      <div class="timer-label" id="timerStatusText">세트 버튼을 누르면<br>휴식 타이머가 자동 시작됩니다</div>
    </div>
    <div class="timer-controls">
      <button class="t-btn" onclick="adjustTimer(-15)">-15초</button>
      <button class="t-btn" onclick="adjustTimer(15)">+15초</button>
      <button class="t-btn stop" onclick="stopTimer()">정지</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    const STORAGE_KEY = 'shiftLiftHomeGym4SplitV1';

    const defaultData = {
      cycleCount: 1,
      hasMicroPlate: true,
      currentDay: 'd1', // 'rest', 'd1', 'd2', 'd3', 'd4'
      checkedSets: {},
      progression: {
        // [Day 1: 비번1 - 밀기 (가슴/측면어깨/삼두)]
        d1_bench: { weight: 82.5, reps: 5, maxReps: 6, stepW: 2.5, type: 'double' },
        d1_incline_db: { weight: 22.0, reps: 8, maxReps: 10, stepW: 2.0, type: 'double' },
        d1_db_fly: { weight: 12.0, reps: 10, maxReps: 12, stepW: 2.0, type: 'double' },
        d1_side_raise: { weight: 8.0, reps: 12, maxReps: 15, stepW: 1.0, type: 'double' },
        d1_pushdown: { weight: 20.0, reps: 12, maxReps: 15, stepW: 2.5, type: 'double' },

        // [Day 2: 비번2 - 하체 (스쿼트/RDL/스플릿/복근)]
        d2_squat: { weight: 120.0, reps: 3, backoffW: 100.0, backoffReps: 8, stepW: 2.5, type: 'linear_hybrid' },
        d2_rdl: { weight: 95.0, reps: 8, maxReps: 10, stepW: 2.5, type: 'double' },
        d2_split_sq: { weight: 12.0, reps: 10, maxReps: 12, stepW: 2.0, type: 'double' },
        d2_leg_raise: { weight: 0, reps: 12, maxReps: 15, stepW: 0, type: 'reps_only' },

        // [Day 3: 비번1 - 어깨 & 팔 슈퍼세트]
        d3_ohp: { weight: 50.0, reps: 5, maxReps: 6, stepW: 2.5, type: 'double' },
        d3_ss_delt: { dbW: 6.0, cableW: 15.0, reps: 12, maxReps: 15, stepW: 1.0, type: 'double' },
        d3_ss_arms1: { ezW: 19.0, cgbpW: 35.0, reps: 10, maxReps: 12, stepW: 2.5, type: 'double' },
        d3_ss_arms2: { ezW: 19.0, pushW: 20.0, reps: 10, maxReps: 12, stepW: 2.5, type: 'double' },

        // [Day 4: 비번2 - 당기기 (데드/바벨로우/암풀다운/덤벨로우)]
        d4_deadlift: { weight: 155.0, reps: 2, backoffW: 130.0, backoffReps: 5, stepW: 2.5, type: 'linear_hybrid' },
        d4_bb_row: { weight: 70.0, reps: 8, maxReps: 10, stepW: 2.5, type: 'double' },
        d4_arm_pulldown: { weight: 20.0, reps: 12, maxReps: 15, stepW: 2.5, type: 'double' },
        d4_chest_db_row: { weight: 20.0, reps: 10, maxReps: 12, stepW: 2.0, type: 'double' }
      }
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultData));
    let timerInterval = null;
    let remainingSec = 0;

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // 홈짐 원판 조합 안내 (20kg 바벨 / 9kg 이지바)
    function calcPlateText(targetW, barType) {
      if (barType === 'db') return `한손 덤벨 ${targetW}kg`;
      if (barType === 'cable') return `상단 케이블 ${targetW}kg`;
      if (barType === 'body') return `맨몸 수행`;

      const barW = barType === 'ez' ? 9.0 : 20.0;
      const step = state.hasMicroPlate ? 2.5 : 5.0;
      const actualW = barType === 'barbell' ? Math.round(targetW / step) * step : targetW;

      if (actualW <= barW) return `기본 공봉 ${barW}kg 단독`;
      let side = (actualW - barW) / 2;
      const plates = state.hasMicroPlate ? [20, 15, 10, 5, 2.5, 1.25] : [20, 15, 10, 5, 2.5];
      const counts = {};
      for (let p of plates) {
        while (side >= p - 0.001) {
          counts[p] = (counts[p] || 0) + 1;
          side -= p;
        }
      }
      const str = Object.entries(counts).map(([k, v]) => `${k}kg×${v}`).join(' + ');
      return `한쪽 원판(${barW}kg 바): ${str || '정확히 불가'}`;
    }

    function getRoutineForDay(day) {
      const p = state.progression;

      if (day === 'rest') {
        return {
          guide: [
            "• [당직 출근일] 오늘은 웨이트를 완전히 쉬며 중추신경계와 근육을 초과회복시키는 날입니다.",
            "• [식단] 구내식당 밥 2/3공기(140g), 국물에 밥 비비기 금지, 쌈채소 먼저 섭취",
            "• [야간 단식] 21:00 ~ 익일 09:00 물/무칼로리 차 외 섭취 금지 (내장지방 집중 감량 구간)"
          ],
          exercises: [
            {
              id: 'rest_tasks',
              name: '당직일 대사 & 복부팽만 방어 체크리스트 (웨이트 휴식)',
              target: '4가지 수칙 체크 시 휴식일 완수 인정',
              plate: '장비 불필요 (수면 및 식단 관리)',
              note: '출근일을 완벽히 쉬어줘야 내일 비번 1일차(15:35) 세션에서 폭발적인 증량이 가능합니다.',
              rest: 15,
              sets: ['공복 스토막 배큠 5세트', '구내식당 밥 2/3공기 조절', '국물 배제 & 단백질 35g+', '21시 이후 야간단식 성공']
            }
          ]
        };
      }

      if (day === 'd1') {
        return {
          guide: [
            "• [비번 1일차 - Day 1 밀기] 10:30~14:30 1차 수면(4h) -> 기상 직후 미온수 + 바나나 80g + 꿀 1T",
            "• [부스터] 15:00 카페인 섭취(200mg 이하) -> 15:35 본운동 시작",
            "• [운동 직후] WPC 초코 프로틴 + 크레아틴 7g + 계란 2개 섭취 / 24:00 본수면(8h)"
          ],
          exercises: [
            {
              id: 'd1_bench',
              name: '1. 바벨 벤치프레스 (가슴 터치 Full ROM)',
              target: `${p.d1_bench.weight}kg × ${p.d1_bench.reps}회 × 3세트 (상한 ${p.d1_bench.maxReps}회 달성 시 +2.5kg)`,
              plate: calcPlateText(p.d1_bench.weight, 'barbell'),
              note: '견갑 후인·하강 고정 후 가슴 하부 터치. 어깨 충돌 없이 통제하여 밀어올리기',
              rest: 180,
              sets: ['웜업 60kg×5', `본세트1 (${p.d1_bench.reps}회)`, `본세트2 (${p.d1_bench.reps}회)`, `본세트3 (${p.d1_bench.reps}회)`]
            },
            {
              id: 'd1_incline_db',
              name: '2. 인클라인 덤벨 프레스 (윗가슴 근비대)',
              target: `덤벨 각 ${p.d1_incline_db.weight}kg × ${p.d1_incline_db.reps}회 × 3세트 (상한 ${p.d1_incline_db.maxReps}회)`,
              plate: calcPlateText(p.d1_incline_db.weight, 'db'),
              note: '벤치 각도 30도 설정. 바텀에서 윗가슴이 깊게 늘어나는 자극에 집중',
              rest: 120,
              sets: [`1세트 (${p.d1_incline_db.reps}회)`, `2세트 (${p.d1_incline_db.reps}회)`, `3세트 (${p.d1_incline_db.reps}회)`]
            },
            {
              id: 'd1_db_fly',
              name: '3. 플랫 덤벨 플라이 [케이블 플라이 대체]',
              target: `덤벨 각 ${p.d1_db_fly.weight}kg × ${p.d1_db_fly.reps}회 × 3세트 (상한 ${p.d1_db_fly.maxReps}회)`,
              plate: calcPlateText(p.d1_db_fly.weight, 'db'),
              note: '팔꿈치를 살짝 굽혀 가슴을 넓게 벌린 뒤 바텀(최대 이완 구간)에서 1초 버티고 모아주기',
              rest: 75,
              sets: [`1세트 (${p.d1_db_fly.reps}회)`, `2세트 (${p.d1_db_fly.reps}회)`, `3세트 (${p.d1_db_fly.reps}회)`]
            },
            {
              id: 'd1_side_raise',
              name: '4. 덤벨 사이드 레터럴 레이즈 (어깨 프레임)',
              target: `덤벨 각 ${p.d1_side_raise.weight}kg × ${p.d1_side_raise.reps}회 × 4세트 (상한 ${p.d1_side_raise.maxReps}회)`,
              plate: calcPlateText(p.d1_side_raise.weight, 'db'),
              note: '승모근 개입을 막기 위해 귀와 어깨를 멀리 유지하며 팔꿈치를 옆으로 밀어 올리기',
              rest: 60,
              sets: [`1세트 (${p.d1_side_raise.reps}회)`, `2세트 (${p.d1_side_raise.reps}회)`, `3세트 (${p.d1_side_raise.reps}회)`, `4세트 (${p.d1_side_raise.reps}회)`]
            },
            {
              id: 'd1_pushdown',
              name: '5. 상단 케이블 트라이셉스 푸쉬다운 (삼두)',
              target: `${p.d1_pushdown.weight}kg × ${p.d1_pushdown.reps}회 × 3세트 (상한 ${p.d1_pushdown.maxReps}회)`,
              plate: calcPlateText(p.d1_pushdown.weight, 'cable'),
              note: '팔꿈치를 옆구리에 고정하고 끝까지 펴서 1초 강하게 수축',
              rest: 60,
              sets: [`1세트 (${p.d1_pushdown.reps}회)`, `2세트 (${p.d1_pushdown.reps}회)`, `3세트 (${p.d1_pushdown.reps}회)`]
            }
          ]
        };
      }

      if (day === 'd2') {
        const sq = p.d2_squat;
        return {
          guide: [
            "• [비번 2일차 - Day 2 하체] 08:30 기상 (8시간 숙면으로 허리·신경계 컨디션 100%)",
            "• [타임라인] 09:30 일반식(단백질 35g+) -> 14:30 카페인 마감 -> 15:00 하체 세션",
            "• [팁] 다음 하체/데드 세션까지 4일의 휴식이 보장되므로 오늘 하체 볼륨을 끝까지 뽑아내세요."
          ],
          exercises: [
            {
              id: 'd2_squat',
              name: '1. 백 스쿼트 (탑세트 1 + 힐원판 백오프 2)',

    function render() {
      document.getElementById('cycleBadge').textContent = `6일 4분할 사이클 #${state.cycleCount}`;
      document.getElementById('microBtn').textContent = `1.25kg원판: ${state.hasMicroPlate ? '보유' : '없음(5kg단위)'}`;

      ['rest', 'd1', 'd2', 'd3', 'd4'].forEach(d => {
        document.getElementById(`tab-${d}`).classList.toggle('active', state.currentDay === d);
      });

      const routine = getRoutineForDay(state.currentDay);
      const container = document.getElementById('workoutContainer');

      let totalSets = 0;
      let doneSets = 0;
      let html = '';

      routine.exercises.forEach(ex => {
        let exAllDone = true;
        let setsHtml = '';

        ex.sets.forEach((setLabel, sIdx) => {
          totalSets++;
          const key = `${state.currentDay}_${ex.id}_s${sIdx}`;
          const isDone = !!state.checkedSets[key];
          if (isDone) doneSets++;
          else exAllDone = false;

          setsHtml += `
            <div class="set-btn ${isDone ? 'completed' : ''}" onclick="toggleSet('${key}', ${ex.rest}, '${ex.name}')">
              ${isDone ? '✓ 완료' : setLabel}
              <span>${isDone ? setLabel : `터치 시 ${ex.rest}초 휴식`}</span>
            </div>
          `;
        });

        html += `
          <div class="ex-card ${exAllDone ? 'done-card' : ''}">
            <div class="ex-header">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-rest-tag">휴식 ${ex.rest}초</div>
            </div>
            <div class="ex-target">${ex.target}</div>
            <div class="ex-plate">${ex.plate}</div>
            <div class="ex-note">${ex.note}</div>
            <div class="set-grid">${setsHtml}</div>
          </div>
        `;
      });

      container.innerHTML = html;

      const statusEl = document.getElementById('progressStatus');
      const finishBtn = document.getElementById('finishBtn');
      statusEl.textContent = `오늘 진행률: ${doneSets} / ${totalSets} 세트 완료`;

      if (doneSets === totalSets && totalSets > 0) {
        finishBtn.classList.add('ready');
        finishBtn.textContent = state.currentDay === 'rest'
          ? "당직 휴식일 수칙 완수! 비번일 세션으로 이동하기"
          : "오늘 루틴 완벽 수행! 다음 주기 점진적 과부하(+증량) 적용하기";
      } else {
        finishBtn.classList.remove('ready');
        finishBtn.textContent = `남은 ${totalSets - doneSets}개 세트를 모두 체크하면 완료 버튼이 켜집니다`;
      }

      document.getElementById('dailyGuideList').innerHTML = routine.guide.map(g => `<div>${g}</div>`).join('');
    }

    function toggleSet(key, restSec, exName) {
      state.checkedSets[key] = !state.checkedSets[key];
      save();
      render();
      if (state.checkedSets[key] && state.currentDay !== 'rest') {
        startRestTimer(restSec, exName);
      }
    }

    function completeSessionAndOverload() {
      const routine = getRoutineForDay(state.currentDay);
      const totalSets = routine.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);
      const doneSets = routine.exercises.reduce((acc, ex) => {
        return acc + ex.sets.filter((_, sIdx) => state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`]).length;
      }, 0);

      if (doneSets < totalSets) {
        alert("아직 체크하지 않은 세트가 남아 있습니다.");
        return;
      }

      if (state.currentDay === 'rest') {
        advanceToNextDay("• 당직일 완전 휴식 및 야간 단식 완료! 비번일 세션으로 이동합니다.");
        return;
      }

      const p = state.progression;
      const stepBarbell = state.hasMicroPlate ? 2.5 : 5.0;
      let logs = [];

      routine.exercises.forEach(ex => {
        const item = p[ex.id];
        if (!item) return;

        if (item.type === 'linear_hybrid') {
          item.weight += stepBarbell;
          item.backoffW += stepBarbell;
          logs.push(`• ${ex.name}: 탑세트 ${item.weight}kg / 백오프 ${item.backoffW}kg로 +${stepBarbell}kg 증량!`);
        } else if (item.type === 'double') {
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 목표 횟수 +1회 증량 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 2;
            if (item.ezW !== undefined && item.cgbpW !== undefined) {
              item.ezW += 2.5;
              item.cgbpW += stepBarbell;
              logs.push(`• ${ex.name}: 상한 달성! 이지바 ${item.ezW}kg / CGBP ${item.cgbpW}kg로 증량`);
            } else if (item.ezW !== undefined && item.pushW !== undefined) {
              item.ezW += 2.5;
              item.pushW += 2.5;
              logs.push(`• ${ex.name}: 상한 달성! 이지바 ${item.ezW}kg / 푸쉬다운 ${item.pushW}kg로 증량`);
            } else if (item.dbW !== undefined && item.cableW !== undefined) {
              item.dbW += 1.0;
              item.cableW += 2.5;
              logs.push(`• ${ex.name}: 상한 달성! 사레레 ${item.dbW}kg / 페이스풀 ${item.cableW}kg로 증량`);
            } else {
              const inc = ex.id.includes('bench') || ex.id.includes('ohp') || ex.id.includes('rdl') || ex.id.includes('bb_row')
                ? stepBarbell : item.stepW;
              item.weight += inc;
              logs.push(`• ${ex.name}: 상한 횟수 달성! 중량 +${inc}kg 증량 (-> ${item.weight}kg × ${item.reps}회)`);
            }
          }
        } else if (item.type === 'reps_only') {
          item.reps += 1;
          logs.push(`• ${ex.name}: 목표 횟수 +1회 증량 (-> ${item.reps}회)`);
        }
      });

      advanceToNextDay(logs.join('\n'));
    }

    function completeWithoutOverload() {
      if (!confirm("현재 중량과 횟수를 유지하고 다음 세션으로 넘어가시겠습니까?")) return;
      advanceToNextDay("• 중량 및 횟수 동결 (다음 사이클에 동일 중량 재도전)");
    }

    function advanceToNextDay(summaryLog) {
      const routine = getRoutineForDay(state.currentDay);
      routine.exercises.forEach(ex => {
        ex.sets.forEach((_, sIdx) => {
          delete state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`];
        });
      });

      // 순환 순서: d1(비번1) -> d2(비번2) -> rest(당직) -> d3(비번1) -> d4(비번2) -> rest(당직)
      const order = { 'd1': 'd2', 'd2': 'rest', 'rest': 'd3', 'd3': 'd4', 'd4': 'd1' };
      if (state.currentDay === 'd4') {
        state.cycleCount += 1;
        summaryLog += `\n\n[4분할 1바퀴 완주!] 사이클 #${state.cycleCount}이 시작됩니다. 내일 당직 휴식 후 Day 1으로 이어집니다.`;
      }
      state.currentDay = order[state.currentDay] || 'd1';

      stopTimer();
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      alert(`[세션 완료 및 다음 주기 세팅 내역]\n\n${summaryLog}`);
    }

    function selectDay(day) {
      state.currentDay = day;
      save();
      render();
    }

    function toggleMicroPlate() {
      state.hasMicroPlate = !state.hasMicroPlate;
      save();
      render();
    }

    function notifyTimerEnd() {
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [880, 1100].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.22);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.22);
          osc.stop(ctx.currentTime + idx * 0.22 + 0.18);
        });
      } catch (e) {}
    }

    function startRestTimer(seconds, label) {
      if (timerInterval) clearInterval(timerInterval);
      remainingSec = seconds;
      const dock = document.getElementById('timerDock');
      dock.className = 'timer-dock running';
      document.getElementById('timerStatusText').innerHTML = `<strong>${label}</strong><br>휴식 진행 중...`;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingSec--;
        updateTimerDisplay();
        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          dock.className = 'timer-dock finished';
          document.getElementById('timerDisplay').textContent = "START!";
          document.getElementById('timerStatusText').innerHTML = `<strong>휴식 종료!</strong><br>다음 세트에 들어가세요`;
          notifyTimerEnd();
        }
      }, 1000);
    }

    function adjustTimer(delta) {
      if (!timerInterval && remainingSec <= 0) {
        if (delta > 0) startRestTimer(delta, '수동 타이머');
        return;
      }
      remainingSec = Math.max(0, remainingSec + delta);
      updateTimerDisplay();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      remainingSec = 0;
      document.getElementById('timerDock').className = 'timer-dock';
      document.getElementById('timerDisplay').textContent = "00:00";
      document.getElementById('timerStatusText').innerHTML = "세트 버튼을 누르면<br>휴식 타이머가 자동 시작됩니다";
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const s = String(remainingSec % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }

    function resetAll() {
      if (confirm("모든 증량 기록을 초기 베이스라인으로 리셋하시겠습니까?")) {
        localStorage.removeItem(STORAGE_KEY);
        state = JSON.parse(JSON.stringify(defaultData));
        stopTimer();
        render();
      }
    }

    render();
  </script>
</body>
</html>
