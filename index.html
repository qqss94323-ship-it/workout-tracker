<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SHIFT-LIFT WORKOUT TRACKER</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --box: #222731;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --border: #2d3340;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 12px 12px 110px 12px; max-width: 640px; margin: 0 auto; line-height: 1.45; }

    /* 상단 헤더 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
    .title { font-size: 1.15rem; font-weight: 800; color: #fff; }
    .sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .cycle-badge { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }

    /* 근무일 탭 */
    .day-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
    .tab { padding: 11px 6px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 0.84rem; font-weight: 700; color: var(--muted); cursor: pointer; }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* 운동 카드 */
    .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .ex-card.done-card { border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.04); }
    .ex-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .ex-name { font-size: 1rem; font-weight: 700; color: #fff; }
    .ex-rest-tag { font-size: 0.75rem; padding: 3px 7px; border-radius: 4px; background: var(--box); color: var(--amber); font-weight: 600; white-space: nowrap; }
    .ex-target { font-size: 0.9rem; font-weight: 700; color: #60a5fa; margin-bottom: 4px; }
    .ex-plate { font-size: 0.78rem; color: #34d399; background: rgba(16, 185, 129, 0.1); padding: 5px 8px; border-radius: 5px; margin-bottom: 8px; display: inline-block; font-weight: 600; }
    .ex-note { font-size: 0.76rem; color: var(--muted); margin-bottom: 10px; }

    /* 세트 체크 버튼 그리드 */
    .set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(85px, 1fr)); gap: 8px; }
    .set-btn { padding: 11px 8px; background: var(--box); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.82rem; font-weight: 700; text-align: center; cursor: pointer; transition: all 0.15s; user-select: none; }
    .set-btn.completed { background: var(--green); border-color: var(--green); color: #052e16; }
    .set-btn span { display: block; font-size: 0.72rem; font-weight: 500; opacity: 0.85; margin-top: 2px; }

    /* 완료 및 점진적 과부하 버튼 영역 */
    .finish-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; margin-top: 16px; }
    .progress-status { font-size: 0.88rem; font-weight: 700; margin-bottom: 10px; color: var(--muted); }
    .btn-finish { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; background: var(--box); color: var(--muted); transition: 0.2s; }
    .btn-finish.ready { background: var(--green); color: #052e16; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }

    /* 식단/타임라인 접기 메뉴 (심플) */
    details { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
    summary { font-size: 0.88rem; font-weight: 700; cursor: pointer; color: var(--text); }
    .simple-list { margin-top: 10px; font-size: 0.8rem; color: var(--muted); }
    .simple-list div { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    /* 하단 고정 자동 휴식 타이머 바 */
    .timer-dock { position: fixed; bottom: 0; left: 0; right: 0; background: #14171f; border-top: 2px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; max-width: 640px; margin: 0 auto; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.6); }
    .timer-dock.running { border-top-color: var(--amber); }
    .timer-dock.finished { border-top-color: var(--green); background: #0c261c; }
    .timer-left { display: flex; align-items: center; gap: 12px; }
    .timer-time { font-size: 1.65rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--amber); min-width: 75px; }
    .timer-label { font-size: 0.78rem; color: var(--muted); line-height: 1.25; }
    .timer-controls { display: flex; gap: 6px; }
    .t-btn { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--box); color: var(--text); font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .t-btn.stop { background: var(--red); border-color: var(--red); color: #fff; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div>
      <div class="title">SHIFT-LIFT TRACKER</div>
      <div class="sub" id="waveSubText">고중량 스쿼트 주간 (데드리프트는 스피드 볼륨)</div>
    </div>
    <div style="text-align:right;">
      <div class="cycle-badge" id="cycleBadge">주기 #1 (Wave A)</div>
      <div style="margin-top:4px; display:flex; gap:6px; justify-content:flex-end;">
        <button class="t-btn" style="padding:3px 7px; font-size:0.7rem;" onclick="toggleMicroPlate()" id="microBtn">1.25kg원판: 보유</button>
        <button class="t-btn" style="padding:3px 7px; font-size:0.7rem;" onclick="resetAll()">초기화</button>
      </div>
    </div>
  </header>

  <!-- 당비비 3일 선택 탭 -->
  <div class="day-tabs">
    <div class="tab active" id="tab-duty" onclick="selectDay('duty')">1. 출근일(당직)<br><span style="font-size:0.7rem; font-weight:500;">견갑 + 팔 30분</span></div>
    <div class="tab" id="tab-off1" onclick="selectDay('off1')">2. 비번 1일차<br><span style="font-size:0.7rem; font-weight:500;">스쿼트 + 벤치</span></div>
    <div class="tab" id="tab-off2" onclick="selectDay('off2')">3. 비번 2일차<br><span style="font-size:0.7rem; font-weight:500;">데드 + OHP + 등</span></div>
  </div>

  <!-- 오늘 해야 할 운동 리스트 렌더링 영역 -->
  <main id="workoutContainer"></main>

  <!-- 운동 완료 및 점진적 과부하 트리거 박스 -->
  <section class="finish-box">
    <div class="progress-status" id="progressStatus">진행률: 0 / 0 세트 완료</div>
    <button class="btn-finish" id="finishBtn" onclick="completeSessionAndOverload()">
      모든 세트를 체크하면 점진적 과부하가 활성화됩니다
    </button>
    <div class="sub" style="margin-top:8px;">
      * 세트를 다 채우지 못했거나 실패한 경우 아래 [중량 유지하고 세션 종료]를 누르세요.
    </div>
    <button class="t-btn" style="margin-top:8px; width:100%;" onclick="completeWithoutOverload()">
      오늘은 중량/횟수 유지하고 세션 기록만 저장
    </button>
  </section>

  <!-- 당일 핵심 타임라인 & 식단 요약 (접기/펴기) -->
  <details>
    <summary>오늘의 수면·식단 핵심 수칙 보기 (터치하여 열기)</summary>
    <div class="simple-list" id="dailyGuideList"></div>
  </details>

  <!-- 하단 고정 자동 휴식 타이머 -->
  <div class="timer-dock" id="timerDock">
    <div class="timer-left">
      <div class="timer-time" id="timerDisplay">00:00</div>
      <div class="timer-label" id="timerStatusText">세트 버튼을 누르면<br>휴식 타이머가 자동 시작됩니다</div>
    </div>
    <div class="timer-controls">
      <button class="t-btn" onclick="adjustTimer(-15)">-15초</button>
      <button class="t-btn" onclick="adjustTimer(15)">+15초</button>
      <button class="t-btn stop" onclick="stopTimer()">정지</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    const STORAGE_KEY = 'shiftLiftWorkoutV3';

    // 초기 운동 데이터베이스 (현재 수행 능력 및 교정된 루틴 반영)
    const defaultData = {
      cycleCount: 1,
      wave: 'A', // A: 스쿼트 고중량 + 데드 볼륨 / B: 스쿼트 볼륨 + 데드 고중량
      hasMicroPlate: true, // 1.25kg 원판 보유 여부
      currentDay: 'duty',
      checkedSets: {}, // { 'duty_ex0_s0': true }
      // 종목별 현재 목표 중량(kg) 및 목표 횟수(reps) 상태
      progression: {
        // [출근일 - 당직]
        facepull: { weight: 15.0, reps: 15, maxReps: 20, stepW: 2.5, type: 'double' },
        superset_arms: { ezW: 19.0, cgbpW: 35.0, reps: 10, maxReps: 12, stepW: 2.5, type: 'double' },
        ez_curl: { weight: 19.0, reps: 10, maxReps: 12, stepW: 2.5, type: 'double' },
        triceps_iso: { weight: 10.0, reps: 12, maxReps: 15, stepW: 2.0, type: 'double' },

        // [비번 1일차 - 하체/밀기]
        squat_top: { weight: 120.0, reps: 3, stepW: 2.5, type: 'linear' },
        squat_PauseWaveB: { weight: 95.0, reps: 5, stepW: 2.5, type: 'linear' },
        bench: { weight: 82.5, reps: 5, stepW: 2.5, type: 'linear' },
        incline_db: { weight: 20.0, reps: 10, maxReps: 12, stepW: 2.0, type: 'double' },

        // [비번 2일차 - 데드/당기기]
        deadlift_top: { weight: 155.0, reps: 2, stepW: 2.5, type: 'linear' },
        deadlift_SpeedWaveA: { weight: 120.0, reps: 5, stepW: 2.5, type: 'linear' },
        ohp: { weight: 50.0, reps: 5, stepW: 2.5, type: 'linear' },
        barbell_row: { weight: 70.0, reps: 8, maxReps: 10, stepW: 2.5, type: 'double' },
        lat_pulldown: { weight: 50.0, reps: 10, maxReps: 12, stepW: 5.0, type: 'double' }
      }
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultData));
    let timerInterval = null;
    let remainingSec = 0;

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // 원판 계산기 (바벨 20kg 공봉, 이지바 9kg 반영)
    function calcPlateText(targetW, barType) {
      if (barType === 'cable' || barType === 'db') {
        return barType === 'db' ? `한손 덤벨 ${targetW}kg` : `케이블/밴드 적정 중량 (${targetW}kg)`;
      }
      const barW = barType === 'ez' ? 9.0 : 20.0;
      const step = state.hasMicroPlate ? 2.5 : 5.0;
      const actualW = barType === 'barbell' ? Math.round(targetW / step) * step : targetW;

      if (actualW <= barW) return `기본 공봉 ${barW}kg 단독`;
      let side = (actualW - barW) / 2;
      const plates = state.hasMicroPlate ? [20, 15, 10, 5, 2.5, 1.25] : [20, 15, 10, 5, 2.5];
      const counts = {};
      for (let p of plates) {
        while (side >= p - 0.001) {
          counts[p] = (counts[p] || 0) + 1;
          side -= p;
        }
      }
      const str = Object.entries(counts).map(([k, v]) => `${k}kg×${v}`).join(' + ');
      return `한쪽 원판(${barW}kg 바): ${str || '정확히 불가'}`;
    }

    // 근무일별 운동 구성 생성 함수
    function getRoutineForDay(day) {
      const p = state.progression;
      const isWaveA = state.wave === 'A';

      if (day === 'duty') {
        return {
          guide: [
            "• [목적] 요추 피로 0% 유지 및 내일 벤치프레스 어깨 충돌 방지(외회전근 활성화)",
            "• [식단] 구내식당 밥 2/3공기(140g), 국물 비비기 금지, 쌈채소 선행 섭취",
            "• [야간 단식] 21:00 ~ 익일 09:00 물/차 외 칼로리 섭취 차단 (내장지방 방어)"
          ],
          exercises: [
            {
              id: 'facepull',
              name: '1. 케이블/밴드 페이스풀 (견갑 안정화)',
              target: `${p.facepull.weight}kg × ${p.facepull.reps}회 (목표 상한 ${p.facepull.maxReps}회)`,
              plate: calcPlateText(p.facepull.weight, 'cable'),
              note: '견갑골 후인·하강 후 이마 쪽으로 당기며 외회전 1초 정지 (내일 벤치 어깨 보호 필수 종목)',
              rest: 60,
              sets: [`1세트 (${p.facepull.reps}회)`, `2세트 (${p.facepull.reps}회)`, `3세트 (${p.facepull.reps}회)`]
            },
            {
              id: 'superset_arms',
              name: '2. [3연속 슈퍼세트] 리버스컬 + 라잉익스텐션 + 클로즈그립벤치',
              target: `이지바 ${p.superset_arms.ezW}kg × ${p.superset_arms.reps}회 / 바벨 CGBP ${p.superset_arms.cgbpW}kg × ${p.superset_arms.reps}회`,
              plate: `이지바: ${calcPlateText(p.superset_arms.ezW, 'ez')} | 바벨: ${calcPlateText(p.superset_arms.cgbpW, 'barbell')}`,
              note: '3종목을 휴식 없이 연속 수행 후 라운드 버튼 터치 -> 90초 휴식 (RPE 8 수준, 실패지점 전 종료)',
              rest: 90,
              sets: ['1라운드 완수', '2라운드 완수', '3라운드 완수']
            },
            {
              id: 'ez_curl',
              name: '3. 스탠다드 이지바 컬 (네거티브 2초)',
              target: `${p.ez_curl.weight}kg × ${p.ez_curl.reps}회 (상한 ${p.ez_curl.maxReps}회 달성 시 증량)`,
              plate: calcPlateText(p.ez_curl.weight, 'ez'),
              note: '내리는 동작(신장성 수축)을 2초간 통제하며 팔꿈치 고정',
              rest: 60,
              sets: [`1세트 (${p.ez_curl.reps}회)`, `2세트 (${p.ez_curl.reps}회)`, `3세트 (${p.ez_curl.reps}회)`]
            },
            {
              id: 'triceps_iso',
              name: '4. 덤벨 킥백 (또는 케이블 푸쉬다운)',
              target: `${p.triceps_iso.weight}kg × ${p.triceps_iso.reps}회 (상한 ${p.triceps_iso.maxReps}회 달성 시 증량)`,
              plate: calcPlateText(p.triceps_iso.weight, 'db'),
              note: '수축 지점에서 1초 짜주기, 반동 배제',
              rest: 60,
              sets: [`1세트 (${p.triceps_iso.reps}회)`, `2세트 (${p.triceps_iso.reps}회)`, `3세트 (${p.triceps_iso.reps}회)`]
            }
          ]
        };
      }

      if (day === 'off1') {
        const sqTopW = p.squat_top.weight;
        const sqBackoffW = Math.round((sqTopW * 0.88) / 2.5) * 2.5;
        const sqWaveBW = p.squat_PauseWaveB.weight;

        const squatEx = isWaveA
          ? {
              id: 'squat_top',
              name: '1. 백 스쿼트 [Wave A: 고중량 탑세트 날]',
              target: `탑세트 ${sqTopW}kg × ${p.squat_top.reps}회 (1세트) + 백오프 ${sqBackoffW}kg × 5회 (2세트)`,
              plate: `탑세트: ${calcPlateText(sqTopW, 'barbell')} | 백오프: ${calcPlateText(sqBackoffW, 'barbell')}`,
              note: '10mm 레버 벨트 + 뒤꿈치 원판 적용. 완수 시 다음 Wave A 주기에 탑세트 +2.5kg 자동 증량!',
              rest: 210,
              sets: [`웜업 80kg×5`, `웜업 100kg×3`, `탑세트 ${sqTopW}kg×${p.squat_top.reps}`, `백오프 ${sqBackoffW}kg×5`, `백오프 ${sqBackoffW}kg×5`]
            }
          : {
              id: 'squat_PauseWaveB',
              name: '1. 백 스쿼트 [Wave B: 가동범위·정지 볼륨 날]',
              target: `본세트 ${sqWaveBW}kg × 5회 × 3세트 (바텀 1초 정지)`,
              plate: calcPlateText(sqWaveBW, 'barbell'),
              note: '내일 데드리프트 고중량 PR 도전을 위해 오늘 스쿼트는 요추 피로를 아끼며 바텀 텐션에 집중합니다.',
              rest: 150,
              sets: [`웜업 75kg×5`, `본세트1 ${sqWaveBW}kg×5`, `본세트2 ${sqWaveBW}kg×5`, `본세트3 ${sqWaveBW}kg×5`]
            };

        return {
          guide: [
            "• [수면] 10:30~14:30 1차 수면(4h) -> 기상 직후 미온수 400ml + 바나나 80g + 꿀 1T",
            "• [부스터] 15:00 카페인 섭취(200mg 이하) -> 15:35 본운동 시작",
            "• [식단/유산소] 운동 직후 WPC+크레아틴7g+계란2개 / 저녁 원주천 평지 러닝·빠른걷기 25분 / 24:00 본수면"
          ],
          exercises: [
            squatEx,
            {
              id: 'bench',
              name: '2. 바벨 벤치프레스 (가슴 터치 Full ROM 교정)',
              target: `${p.bench.weight}kg × ${p.bench.reps}회 × 3세트`,
              plate: calcPlateText(p.bench.weight, 'barbell'),
              note: '어깨 충돌 방지: 견갑 후인·하강 고정 후 가슴 하부 터치. 3세트 완수 시 다음 주기 +2.5kg 증량!',
              rest: 180,
              sets: [`웜업 60kg×5`, `본세트1 ${p.bench.weight}kg×${p.bench.reps}`, `본세트2 ${p.bench.weight}kg×${p.bench.reps}`, `본세트3 ${p.bench.weight}kg×${p.bench.reps}`]
            },
            {
              id: 'incline_db',
              name: '3. 인클라인 덤벨 프레스 (상부 가슴 보조)',
              target: `덤벨 각 ${p.incline_db.weight}kg × ${p.incline_db.reps}회 × 3세트`,
              plate: calcPlateText(p.incline_db.weight, 'db'),
              note: '벤치 각도 30도 설정, 팔꿈치가 어깨선 아래로 살짝 내려오도록 스트레칭',
              rest: 90,
              sets: [`1세트 (${p.incline_db.reps}회)`, `2세트 (${p.incline_db.reps}회)`, `3세트 (${p.incline_db.reps}회)`]
            }
          ]
        };
      }

      if (day === 'off2') {
        const dlTopW = p.deadlift_top.weight;
        const dlBackoffW = Math.round((dlTopW * 0.87) / 2.5) * 2.5;
        const dlWaveAW = p.deadlift_SpeedWaveA.weight;

        const deadliftEx = !isWaveA
          ? {
              id: 'deadlift_top',
              name: '1. 컨벤셔널 데드리프트 [Wave B: 고중량 PR 타깃 날]',
              target: `탑세트 ${dlTopW}kg × ${p.deadlift_top.reps}회 (1세트) + 백오프 ${dlBackoffW}kg × 3회 (2세트)`,
              plate: `탑세트: ${calcPlateText(dlTopW, 'barbell')} | 백오프: ${calcPlateText(dlBackoffW, 'barbell')}`,
              note: '어제 스쿼트에서 아낀 요추 힘으로 160kg 복구를 향해 당깁니다. 완수 시 다음 Wave B 주기에 +2.5kg 증량!',
              rest: 240,
              sets: [`웜업 100kg×5`, `웜업 130kg×2`, `탑세트 ${dlTopW}kg×${p.deadlift_top.reps}`, `백오프 ${dlBackoffW}kg×3`, `백오프 ${dlBackoffW}kg×3`]
            }
          : {
              id: 'deadlift_SpeedWaveA',
              name: '1. 컨벤셔널 데드리프트 [Wave A: 스피드·자세 볼륨 날]',
              target: `본세트 ${dlWaveAW}kg × 5회 × 3세트 (빠른 컨센트릭 속도)`,
              plate: calcPlateText(dlWaveAW, 'barbell'),
              note: '어제 고중량 스쿼트를 수행했으므로 오늘은 75~80% 중량으로 광배근 텐션과 데드 스톱 자세만 정교하게 다듬습니다.',
              rest: 150,
              sets: [`웜업 90kg×5`, `본세트1 ${dlWaveAW}kg×5`, `본세트2 ${dlWaveAW}kg×5`, `본세트3 ${dlWaveAW}kg×5`]
            };

        return {
          guide: [
            "• [타임라인] 08:30 기상 -> 09:30 첫 끼니(단백질 35g+) -> 14:30 카페인 마감 -> 15:00 체온 정점 세션",
            "• [식단] 시판 볶음밥 섭취 시 무조건 계란 2개 추가 / 널담 베이글·WPC·크레아틴은 운동 직후 섭취",
            "• [수면] 23:00~23:30 취침 (카페인 섭취 후 8.5시간 경과로 깊은 서파 수면 확보)"
          ],
          exercises: [
            deadliftEx,
            {
              id: 'ohp',
              name: '2. 오버헤드 프레스 (OHP)',
              target: `${p.ohp.weight}kg × ${p.ohp.reps}회 × 3세트`,
              plate: calcPlateText(p.ohp.weight, 'barbell'),
              note: '둔근과 복압을 강하게 조여 허리 과신전 방지. 완수 시 다음 주기 +2.5kg 증량!',
              rest: 180,
              sets: [`웜업 30kg×5`, `본세트1 ${p.ohp.weight}kg×${p.ohp.reps}`, `본세트2 ${p.ohp.weight}kg×${p.ohp.reps}`, `본세트3 ${p.ohp.weight}kg×${p.ohp.reps}`]
            },
            {
              id: 'barbell_row',
              name: '3. 바벨 로우 (또는 케이블 시티드 로우)',
              target: `${p.barbell_row.weight}kg × ${p.barbell_row.reps}회 × 3세트 (상한 ${p.barbell_row.maxReps}회)`,
              plate: calcPlateText(p.barbell_row.weight, 'barbell'),
              note: '배꼽 쪽으로 당기며 견갑골 강하게 수축',
              rest: 120,
              sets: [`1세트 (${p.barbell_row.reps}회)`, `2세트 (${p.barbell_row.reps}회)`, `3세트 (${p.barbell_row.reps}회)`]
            },
            {
              id: 'lat_pulldown',
              name: '4. 케이블 랫풀다운 (수직 당기기)',
              target: `${p.lat_pulldown.weight}kg × ${p.lat_pulldown.reps}회 × 3세트 (상한 ${p.lat_pulldown.maxReps}회)`,
              plate: calcPlateText(p.lat_pulldown.weight, 'cable'),
              note: '어깨가 으쓱하지 않도록 광배근 하부로 먼저 누르며 당기기',
              rest: 90,
              sets: [`1세트 (${p.lat_pulldown.reps}회)`, `2세트 (${p.lat_pulldown.reps}회)`, `3세트 (${p.lat_pulldown.reps}회)`]
            }
          ]
        };
      }
    }

    function render() {
      // 상단 주기 및 Wave 표시
      document.getElementById('cycleBadge').textContent = `당비비 주기 #${state.cycleCount} (Wave ${state.wave})`;
      document.getElementById('waveSubText').textContent = state.wave === 'A'
        ? "이번 주기(Wave A): 비번1 스쿼트 고중량 증량 / 비번2 데드는 스피드 볼륨"
        : "이번 주기(Wave B): 비번1 스쿼트 정지 볼륨 / 비번2 데드 고중량 증량";
      document.getElementById('microBtn').textContent = `1.25kg원판: ${state.hasMicroPlate ? '보유' : '없음(5kg단위)'}`;

      ['duty', 'off1', 'off2'].forEach(d => {
        document.getElementById(`tab-${d}`).classList.toggle('active', state.currentDay === d);
      });

      const routine = getRoutineForDay(state.currentDay);
      const container = document.getElementById('workoutContainer');

      let totalSets = 0;
      let doneSets = 0;
      let html = '';

      routine.exercises.forEach((ex, exIdx) => {
        let exAllDone = true;
        let setsHtml = '';

        ex.sets.forEach((setLabel, sIdx) => {
          totalSets++;
          const key = `${state.currentDay}_${ex.id}_s${sIdx}`;
          const isDone = !!state.checkedSets[key];
          if (isDone) doneSets++;
          else exAllDone = false;

          setsHtml += `
            <div class="set-btn ${isDone ? 'completed' : ''}" onclick="toggleSet('${key}', ${ex.rest}, '${ex.name}')">
              ${isDone ? '✓ 완료' : setLabel}
              <span>${isDone ? setLabel : `터치 시 ${ex.rest}초 휴식`}</span>
            </div>
          `;
        });

        html += `
          <div class="ex-card ${exAllDone ? 'done-card' : ''}">
            <div class="ex-header">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-rest-tag">휴식 ${ex.rest}초</div>
            </div>
            <div class="ex-target">${ex.target}</div>
            <div class="ex-plate">${ex.plate}</div>
            <div class="ex-note">${ex.note}</div>
            <div class="set-grid">${setsHtml}</div>
          </div>
        `;
      });

      container.innerHTML = html;

      // 하단 진행률 및 점진적 과부하 버튼 상태 업데이트
      const statusEl = document.getElementById('progressStatus');
      const finishBtn = document.getElementById('finishBtn');
      statusEl.textContent = `오늘 세트 진행률: ${doneSets} / ${totalSets} 세트 완료`;

      if (doneSets === totalSets && totalSets > 0) {
        finishBtn.classList.add('ready');
        finishBtn.textContent = "오늘 루틴 완벽 수행! 다음 주기 점진적 과부하(+증량) 적용하기";
      } else {
        finishBtn.classList.remove('ready');
        finishBtn.textContent = `남은 ${totalSets - doneSets}개 세트를 모두 체크하면 자동 증량이 활성화됩니다`;
      }

      // 가이드 렌더링
      document.getElementById('dailyGuideList').innerHTML = routine.guide.map(g => `<div>${g}</div>`).join('');
    }

    // 세트 체크 & 자동 타이머 실행
    function toggleSet(key, restSec, exName) {
      state.checkedSets[key] = !state.checkedSets[key];
      save();
      render();

      // 체크를 켠 경우에만 즉시 해당 종목의 휴식 타이머 시작
      if (state.checkedSets[key]) {
        startRestTimer(restSec, exName);
      }
    }

    // 점진적 과부하 핵심 로직
    function completeSessionAndOverload() {
      const routine = getRoutineForDay(state.currentDay);
      const totalSets = routine.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);
      const doneSets = routine.exercises.reduce((acc, ex) => {
        return acc + ex.sets.filter((_, sIdx) => state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`]).length;
      }, 0);

      if (doneSets < totalSets) {
        alert("아직 체크하지 않은 세트가 남아 있습니다. 모든 세트를 완수한 경우에만 자동 증량이 적용됩니다.");
        return;
      }

      const p = state.progression;
      const stepBarbell = state.hasMicroPlate ? 2.5 : 5.0;
      let logs = [];

      routine.exercises.forEach(ex => {
        const item = p[ex.id];
        if (!item) return;

        if (item.type === 'linear') {
          // 바벨 메인 운동: 1.25kg 원판이 없으면 횟수를 먼저 5회까지 늘린 뒤 +5kg 증량, 있으면 바로 +2.5kg 증량
          if (!state.hasMicroPlate && item.reps < 5) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 목표 횟수 +1회 증량 (${item.weight}kg × ${item.reps}회)`);
          } else {
            item.weight += stepBarbell;
            if (!state.hasMicroPlate && ex.id.includes('top')) item.reps = 3;
            logs.push(`• ${ex.name}: 중량 +${stepBarbell}kg 증량 (-> ${item.weight}kg)`);
          }
        } else if (item.type === 'double') {
          // 단관절/보조 운동: 상한 횟수 전까지는 +1회 증량, 상한 도달 시 중량 올리고 횟수 초기화
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 반복 횟수 +1회 증량 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 2;
            if (ex.id === 'superset_arms') {
              item.ezW += 2.5;
              item.cgbpW += stepBarbell;
              logs.push(`• ${ex.name}: 상한 횟수 달성! 이지바 ${item.ezW}kg / CGBP ${item.cgbpW}kg로 중량 증량`);
            } else {
              item.weight += item.stepW;
              logs.push(`• ${ex.name}: 상한 횟수 달성! 중량 +${item.stepW}kg 증량 (-> ${item.weight}kg × ${item.reps}회)`);
            }
          }
        }
      });

      advanceToNextDay(logs.join('\n'));
    }

    function completeWithoutOverload() {
      if (!confirm("현재 중량과 횟수를 그대로 유지하고 다음 근무일 세션으로 넘어가시겠습니까?")) return;
      advanceToNextDay("• 중량 및 횟수 동결 (다음 주기에 동일 중량 재도전)");
    }

    function advanceToNextDay(summaryLog) {
      // 오늘 체크 기록 초기화 및 다음 날로 자동 이동
      const routine = getRoutineForDay(state.currentDay);
      routine.exercises.forEach(ex => {
        ex.sets.forEach((_, sIdx) => {
          delete state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`];
        });
      });

      if (state.currentDay === 'duty') {
        state.currentDay = 'off1';
      } else if (state.currentDay === 'off1') {
        state.currentDay = 'off2';
      } else if (state.currentDay === 'off2') {
        // 비번 2일차까지 끝나면 당비비 1주기 완료 -> Wave A/B 교차 전환!
        state.currentDay = 'duty';
        state.cycleCount += 1;
        state.wave = state.wave === 'A' ? 'B' : 'A';
        summaryLog += `\n\n[당비비 3일 주기 완주!] 주기 #${state.cycleCount}로 넘어가며 척추 보호를 위해 Wave ${state.wave}로 자동 전환되었습니다.`;
      }

      stopTimer();
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      alert(`[세션 완료 및 다음 주기 세팅 내역]\n\n${summaryLog}`);
    }

    function selectDay(day) {
      state.currentDay = day;
      save();
      render();
    }

    function toggleMicroPlate() {
      state.hasMicroPlate = !state.hasMicroPlate;
      save();
      render();
    }

    // 타이머 사운드 & 진동
    function notifyTimerEnd() {
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [880, 1100].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.22);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.22);
          osc.stop(ctx.currentTime + idx * 0.22 + 0.18);
        });
      } catch (e) {}
    }

    function startRestTimer(seconds, label) {
      if (timerInterval) clearInterval(timerInterval);
      remainingSec = seconds;
      const dock = document.getElementById('timerDock');
      dock.className = 'timer-dock running';
      document.getElementById('timerStatusText').innerHTML = `<strong>${label}</strong><br>휴식 진행 중...`;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingSec--;
        updateTimerDisplay();
        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          dock.className = 'timer-dock finished';
          document.getElementById('timerDisplay').textContent = "START!";
          document.getElementById('timerStatusText').innerHTML = `<strong>휴식 종료!</strong><br>다음 세트에 들어가세요`;
          notifyTimerEnd();
        }
      }, 1000);
    }

    function adjustTimer(delta) {
      if (!timerInterval && remainingSec <= 0) {
        if (delta > 0) startRestTimer(delta, '수동 타이머');
        return;
      }
      remainingSec = Math.max(0, remainingSec + delta);
      updateTimerDisplay();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      remainingSec = 0;
      document.getElementById('timerDock').className = 'timer-dock';
      document.getElementById('timerDisplay').textContent = "00:00";
      document.getElementById('timerStatusText').innerHTML = "세트 버튼을 누르면<br>휴식 타이머가 자동 시작됩니다";
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const s = String(remainingSec % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }

    function resetAll() {
      if (confirm("모든 증량 기록을 초기 상태(스쿼트 120kg / 데드 155kg / 벤치 82.5kg)로 초기화할까요?")) {
        localStorage.removeItem(STORAGE_KEY);
        state = JSON.parse(JSON.stringify(defaultData));
        stopTimer();
        render();
      }
    }

    render();
  </script>
</body>
</html>
