<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HOMEGYM PRO · 4-SPLIT</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #111114;
      --card-elevated: #18181c;
      --border: #242429;
      --border-active: #383842;
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-tertiary: #63636e;
      
      --accent: #0a84ff;
      --success: #30d158;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      padding: 20px 16px 140px 16px;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 4px 2px 20px 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .header-left .eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .header-left h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .cycle-pill {
      font-size: 0.74rem;
      font-weight: 800;
      color: #fff;
      background: var(--card-elevated);
      border: 1px solid var(--border-active);
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: -0.01em;
    }
    .util-group {
      display: flex;
      gap: 6px;
    }
    .util-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .util-btn:active {
      background: var(--card-elevated);
      color: #fff;
    }

    .segmented-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--card-bg);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      gap: 4px;
    }
    .seg-btn {
      background: transparent;
      border: none;
      border-radius: 10px;
      padding: 9px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .seg-sub {
      display: block;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-bottom: 1px;
    }
    .seg-main {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: -0.02em;
    }
    .seg-btn.active {
      background: var(--card-elevated);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .seg-btn.active .seg-sub { color: var(--text-secondary); }
    .seg-btn.active .seg-main { color: #fff; font-weight: 800; }

    .workout-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 12px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .workout-card.completed {
      border-color: rgba(48, 209, 88, 0.35);
      background: rgba(48, 209, 88, 0.03);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .ex-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .ex-badges {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .pill {
      font-size: 0.66rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--card-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .pill-accent {
      color: var(--accent);
      border-color: rgba(10, 132, 255, 0.3);
      background: rgba(10, 132, 255, 0.08);
    }

    .ex-spec-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }
    .ex-target {
      font-size: 0.9rem;
      font-weight: 700;
      color: #e4e4e7;
      letter-spacing: -0.01em;
    }
    .ex-plate {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-tertiary);
    }

    .ex-cue {
      font-size: 0.76rem;
      color: var(--text-secondary);
      background: #09090b;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      line-height: 1.45;
      border: 1px solid #1c1c21;
    }

    .sets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 8px;
    }
    .set-chip {
      background: var(--card-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }
    .set-chip:active {
      transform: scale(0.95);
    }
    .chip-top {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .chip-bot {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .set-chip.is-top {
      border-color: rgba(10, 132, 255, 0.45);
    }
    .set-chip.is-top .chip-top { color: #60a5fa; }

    .set-chip.is-back {
      border-color: rgba(255, 159, 10, 0.4);
    }
    .set-chip.is-back .chip-top { color: #fbbf24; }

    .set-chip.is-super {
      border-color: rgba(191, 90, 242, 0.45);
    }
    .set-chip.is-super .chip-top { color: #d8b4fe; }

    .set-chip.checked {
      background: var(--success) !important;
      border-color: var(--success) !important;
    }
    .set-chip.checked .chip-top {
      color: #000000 !important;
      font-weight: 800;
    }
    .set-chip.checked .chip-bot {
      color: rgba(0, 0, 0, 0.72) !important;
      font-weight: 700;
    }

    .summary-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      margin-top: 20px;
    }
    .prog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .prog-label { color: var(--text-secondary); }
    .prog-val { color: #fff; font-variant-numeric: tabular-nums; }
    .prog-bar-bg {
      width: 100%;
      height: 5px;
      background: #222228;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .prog-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      background: var(--card-elevated);
      color: var(--text-tertiary);
      transition: all 0.2s ease;
    }
    .btn-primary.active {
      background: #ffffff;
      color: #000000;
    }
    .btn-row-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-sub {
      padding: 11px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-sub:active {
      background: var(--card-elevated);
      color: #fff;
    }
    .btn-sub.copy {
      color: #fff;
      border-color: var(--border-active);
      background: rgba(255, 255, 255, 0.03);
    }

    details.protocol-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 12px;
    }
    details.protocol-box summary {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    details.protocol-box summary::after {
      content: "보기";
      font-size: 0.72rem;
      color: var(--text-tertiary);
    }
    details.protocol-box[open] summary::after {
      content: "접기";
    }
    .protocol-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .protocol-item {
      font-size: 0.75rem;
      color: var(--text-secondary);
      padding: 8px 10px;
      background: #09090b;
      border-radius: 8px;
      border: 1px solid #1c1c21;
      line-height: 1.4;
    }

    .floating-timer {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      max-width: 532px;
      margin: 0 auto;
      background: rgba(24, 24, 28, 0.92);
      border: 1px solid var(--border-active);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
      z-index: 100;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .floating-timer.running {
      border-color: rgba(255, 159, 10, 0.5);
    }
    .floating-timer.finished {
      border-color: var(--success);
      background: rgba(16, 42, 24, 0.95);
    }
    .timer-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .timer-digits {
      font-size: 1.55rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      color: #fff;
      min-width: 68px;
    }
    .floating-timer.running .timer-digits { color: #ff9f0a; }
    .floating-timer.finished .timer-digits { color: var(--success); }

    .timer-status {
      min-width: 0;
    }
    .timer-status strong {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .timer-status span {
      display: block;
      font-size: 0.68rem;
      color: var(--text-tertiary);
    }

    .timer-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .t-btn {
      background: #27272e;
      border: none;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .t-btn:active { opacity: 0.8; }
    .t-btn.stop {
      background: rgba(255, 69, 58, 0.16);
      color: var(--danger);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
      backdrop-filter: blur(6px);
    }
    .modal-card {
      background: #18181c;
      border: 1px solid var(--border-active);
      border-radius: 20px;
      padding: 22px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.85);
    }
    .modal-card h3 {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .modal-card p {
      font-size: 0.82rem;
      color: var(--text-secondary);
      white-space: pre-line;
      line-height: 1.55;
      margin-bottom: 20px;
    }
    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .m-btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: none;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .m-btn.cancel { background: #27272e; color: var(--text-secondary); }
    .m-btn.confirm { background: #ffffff; color: #000000; font-weight: 800; }
    .m-btn.danger { background: var(--danger); color: #ffffff; font-weight: 800; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <div class="eyebrow">2026 HYPERTROPHY PROTOCOL</div>
      <h1>HOMEGYM 4-SPLIT</h1>
    </div>
    <div class="header-right">
      <div class="cycle-pill" id="cycleBadge">CYCLE #1</div>
      <div class="util-group">
        <button class="util-btn" onclick="toggleMicroPlate()" id="microBtn">1.25kg ON</button>
        <button class="util-btn" onclick="promptReset()">초기화</button>
      </div>
    </div>
  </header>

  <nav class="segmented-tabs">
    <button class="seg-btn" data-day="s1" onclick="selectDay('s1')">
      <span class="seg-sub">SESSION 1</span>
      <span class="seg-main">Push · 삼두</span>
    </button>
    <button class="seg-btn" data-day="s2" onclick="selectDay('s2')">
      <span class="seg-sub">SESSION 2</span>
      <span class="seg-main">Pull · 이두</span>
    </button>
    <button class="seg-btn" data-day="s3" onclick="selectDay('s3')">
      <span class="seg-sub">SESSION 3</span>
      <span class="seg-main">프레임 · 팔</span>
    </button>
    <button class="seg-btn active" data-day="s4" onclick="selectDay('s4')">
      <span class="seg-sub">SESSION 4</span>
      <span class="seg-main">하체 방어</span>
    </button>
  </nav>

  <main id="workoutContainer"></main>

  <section class="summary-box">
    <div class="prog-header">
      <span class="prog-label">세션 진행률</span>
      <span class="prog-val" id="progressStatus">0 / 0 (0%)</span>
    </div>
    <div class="prog-bar-bg">
      <div class="prog-bar-fill" id="progressBar"></div>
    </div>
    
    <button class="btn-primary" id="finishBtn" onclick="completeSessionAndOverload()">
      모든 세트를 완료하면 점진적 과부하가 활성화됩니다
    </button>
    
    <div class="btn-row-split">
      <button class="btn-sub copy" onclick="copyWorkoutLog()">수행 기록 복사</button>
      <button class="btn-sub" onclick="completeWithoutOverload()">중량 동결 · 다음 세션</button>
    </div>
  </section>

  <details class="protocol-box">
    <summary>오늘의 세션 핵심 원칙 & 큐</summary>
    <div class="protocol-list" id="dailyGuideList"></div>
  </details>

  <!-- 플로팅 타이머 -->
  <div class="floating-timer" id="timerDock">
    <div class="timer-left">
      <div class="timer-digits" id="timerDisplay">00:00</div>
      <div class="timer-status" id="timerMeta">
        <strong>휴식 타이머 대기</strong>
        <span>세트 완료 터치 시 자동 시작</span>
      </div>
    </div>
    <div class="timer-actions">
      <button class="t-btn" onclick="adjustTimer(-15)">-15s</button>
      <button class="t-btn" onclick="adjustTimer(15)">+15s</button>
      <button class="t-btn stop" onclick="stopTimer()">정지</button>
    </div>
  </div>

  <!-- 모달 -->
  <div class="modal-backdrop" id="modalOverlay">
    <div class="modal-card">
      <h3 id="modalTitle">알림</h3>
      <p id="modalDesc"></p>
      <div class="modal-footer" id="modalActions">
        <button class="m-btn confirm" onclick="closeModal()">확인</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'homegym_4split_science_v2026_heavy';

    const defaultData = {
      cycleCount: 1,
      hasMicroPlate: true,
      currentDay: 's4',
      checkedSets: {},
      progression: {
        // [Session 1: 상체 Push & 삼두]
        s1_low_incline_bench: {
          topW: 77.5, topReps: 7, maxTopReps: 8,
          backW: 70.0, backReps: 8, maxBackReps: 10,
          stepW: 2.5, type: 'top_backoff'
        },
        s1_incline_db_press: { weight: 24.0, reps: 9, maxReps: 10, stepW: 2.0, type: 'double' },
        s1_lateral_raise: { weight: 7.0, reps: 12, maxReps: 15, stepW: 1.0, type: 'double' },
        s1_lying_tri_ext: { weight: 25.0, reps: 10, maxReps: 12, stepW: 2.5, type: 'double' },
        s1_cable_pushdown: { weight: 15.0, reps: 12, maxReps: 15, stepW: 2.5, type: 'double' },

        // [Session 2: 상체 Pull & 이두]
        s2_barbell_row: {
          topW: 77.5, topReps: 7, maxTopReps: 8,
          backW: 70.0, backReps: 8, maxBackReps: 10,
          stepW: 2.5, type: 'top_backoff'
        },
        s2_body_pullup: { reps: 8, maxReps: 10, stepW: 0, type: 'reps_only' },
        s2_one_arm_row: { weight: 28.0, reps: 11, maxReps: 12, stepW: 2.0, type: 'double' },
        s2_cable_facepull: { weight: 15.0, reps: 16, maxReps: 20, stepW: 2.5, type: 'double' },
        s2_bayesian_curl: { weight: 10.0, reps: 10, maxReps: 12, stepW: 2.5, type: 'double' },

        // [Session 3: 상체 프레임 & 팔 슈퍼세트]
        s3_ohp: {
          topW: 47.5, topReps: 7, maxTopReps: 8,
          backW: 42.5, backReps: 8, maxBackReps: 10,
          stepW: 2.5, type: 'top_backoff'
        },
        s3_cable_arm_pulldown: { weight: 20.0, reps: 13, maxReps: 15, stepW: 2.5, type: 'double' },
        s3_lateral_raise_vol: { weight: 7.0, reps: 15, maxReps: 20, stepW: 1.0, type: 'double' },
        s3_super_arms: { curlW: 25.0, extW: 16.0, reps: 11, maxReps: 12, stepW: 2.5, type: 'super_arms' },
        s3_hammer_curl: { weight: 12.0, reps: 10, maxReps: 12, stepW: 1.0, type: 'double' },

        // [Session 4: 하체 3대 380 방어]
        s4_squat_str: { weight: 110.0, reps: 5, maxReps: 6, stepW: 2.5, type: 'linear_hybrid' },
        s4_deadlift_str: { weight: 130.0, reps: 5, maxReps: 6, stepW: 5.0, type: 'linear_hybrid' },
        s4_bulgarian_split: { weight: 12.0, reps: 10, maxReps: 12, stepW: 2.0, type: 'double' },
        s4_hanging_leg_raise: { reps: 15, maxReps: 20, stepW: 0, type: 'reps_only' }
      }
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultData));
    let timerInterval = null;
    let remainingSec = 0;

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showModal(title, desc, confirmCallback = null) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      const actions = document.getElementById('modalActions');
      if (confirmCallback) {
        actions.innerHTML = `
          <button class="m-btn cancel" onclick="closeModal()">취소</button>
          <button class="m-btn danger" id="modalConfirmBtn">확인</button>
        `;
        document.getElementById('modalConfirmBtn').onclick = () => {
          closeModal();
          confirmCallback();
        };
      } else {
        actions.innerHTML = `<button class="m-btn confirm" onclick="closeModal()">확인</button>`;
      }
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function calcPlateText(targetW, type) {
      if (type === 'db') return `한손 덤벨 ${targetW}kg`;
      if (type === 'cable') return `케이블 스택 ${targetW}kg`;
      if (type === 'body') return `맨몸 (필요 시 스트랩/밴드 보조)`;

      const barW = 20.0;
      const step = state.hasMicroPlate ? 2.5 : 5.0;
      const actualW = Math.round(targetW / step) * step;

      if (actualW <= barW) return `베이스 바벨 20kg 단독`;
      let side = (actualW - barW) / 2;
      const plates = state.hasMicroPlate ? [20, 15, 10, 5, 2.5, 1.25] : [20, 15, 10, 5, 2.5];
      const counts = {};
      for (let p of plates) {
        while (side >= p - 0.001) {
          counts[p] = (counts[p] || 0) + 1;
          side -= p;
        }
      }
      const str = Object.entries(counts).map(([k, v]) => `${k}kg×${v}`).join(' + ');
      return `한쪽 원판 · ${str || '세팅 불가'}`;

              target: `${dl.weight}kg × ${dl.reps}회 × 2세트 (폭발적 힌지)`,
              plate: calcPlateText(dl.weight, 'barbell'),
              note: '스트랩 착용. 바닥을 발로 밀어내는 레그프레스 큐. 척추 중립 고정, RIR 1~2.',
              rest: 180,
              type: 'standard',
              sets: [
                { label: '웜업 70kg×5', rest: 90, style: '' },
                { label: '웜업 105kg×3', rest: 120, style: '' },
                { label: `1세트 (${dl.weight}kg×${dl.reps})`, rest: 180, style: 'is-top' },
                { label: `2세트 (${dl.weight}kg×${dl.reps})`, rest: 180, style: 'is-top' }
              ]
            },
            {
              id: 's4_bulgarian_split',
              name: '3. 덤벨 불가리안 스플릿 스쿼트 (하체 후면·밸런스)',
              target: `양손 각 ${bg.weight}kg × 좌우 각 ${bg.reps}회 × 2세트`,
              plate: calcPlateText(bg.weight, 'db'),
              note: '뒷발을 플랫벤치에 올리고 상체를 약간 숙여 수행. 최하단에서 둔근/햄스트링 신장 1초 정지.',
              rest: 90,
              type: 'standard',
              sets: [
                { label: `1세트 (좌/우 ${bg.reps}회)`, rest: 90, style: '' },
                { label: `2세트 (좌/우 ${bg.reps}회)`, rest: 90, style: '' }
              ]
            },
            {
              id: 's4_hanging_leg_raise',
              name: '4. 파워랙 행잉 레그레이즈',
              target: `맨몸 × ${p.s4_hanging_leg_raise.reps}회 × 3세트`,
              plate: '철봉 매달리기 (코어/복압 강화)',
              note: '골반을 명치 쪽으로 말아올리며 하복부 자극. 척추 감압 효과 병행.',
              rest: 60,
              type: 'standard',
              sets: [
                { label: `1세트 (${p.s4_hanging_leg_raise.reps}회)`, rest: 60, style: '' },
                { label: `2세트 (${p.s4_hanging_leg_raise.reps}회)`, rest: 60, style: '' },
                { label: `3세트 (${p.s4_hanging_leg_raise.reps}회)`, rest: 60, style: '' }
              ]
            }
          ]
        };
      }
    }

    function render() {
      document.getElementById('cycleBadge').textContent = `CYCLE #${state.cycleCount}`;
      document.getElementById('microBtn').textContent = `1.25kg ${state.hasMicroPlate ? 'ON' : 'OFF'}`;

      document.querySelectorAll('.seg-btn').forEach(btn => {
        const d = btn.getAttribute('data-day');
        btn.classList.toggle('active', state.currentDay === d);
      });

      const routine = getRoutineForDay(state.currentDay);
      document.documentElement.style.setProperty('--accent', routine.accent);
      const container = document.getElementById('workoutContainer');

      let totalSets = 0;
      let doneSets = 0;
      let html = '';

      routine.exercises.forEach(ex => {
        let exAllDone = true;
        let setsHtml = '';

        ex.sets.forEach((sObj, sIdx) => {
          totalSets++;
          const key = `${state.currentDay}_${ex.id}_s${sIdx}`;
          const isDone = !!state.checkedSets[key];
          if (isDone) doneSets++;
          else exAllDone = false;

          setsHtml += `
            <div class="set-chip ${sObj.style || ''} ${isDone ? 'checked' : ''}" 
                 onclick="toggleSet('${key}', ${sObj.rest}, '${ex.name}')">
              <span class="chip-top">${isDone ? '완료' : sObj.label}</span>
              <span class="chip-bot">${isDone ? sObj.label : `${sObj.rest}초`}</span>
            </div>
          `;
        });

        html += `
          <div class="workout-card ${exAllDone ? 'completed' : ''}">
            <div class="card-header">
              <div class="ex-title">${ex.name}</div>
              <div class="ex-badges">
                ${ex.type === 'top_backoff' ? '<span class="pill pill-accent">Top+Back</span>' : ''}
                <span class="pill">${ex.rest}s</span>
              </div>
            </div>
            <div class="ex-spec-row">
              <div class="ex-target">${ex.target}</div>
              <div class="ex-plate">${ex.plate}</div>
            </div>
            <div class="ex-cue">${ex.note}</div>
            <div class="sets-grid">${setsHtml}</div>
          </div>
        `;
      });

      container.innerHTML = html;

      const pct = totalSets > 0 ? (doneSets / totalSets) * 100 : 0;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressStatus').textContent = `${doneSets} / ${totalSets} (${Math.round(pct)}%)`;

      const finishBtn = document.getElementById('finishBtn');
      if (doneSets === totalSets && totalSets > 0) {
        finishBtn.classList.add('active');
        finishBtn.textContent = "세션 완료 · 다음 주기 점진적 과부하 적용";
      } else {
        finishBtn.classList.remove('active');
        finishBtn.textContent = `남은 ${totalSets - doneSets}세트 완료 시 증량 활성화`;
      }

      document.getElementById('dailyGuideList').innerHTML = routine.guide.map(g => `<div class="protocol-item">${g}</div>`).join('');
    }

    function toggleSet(key, restSec, exName) {
      state.checkedSets[key] = !state.checkedSets[key];
      save();
      render();
      if (state.checkedSets[key]) {
        startRestTimer(restSec, exName);
      }
    }

    function copyWorkoutLog() {
      const routine = getRoutineForDay(state.currentDay);
      const activeTab = document.querySelector('.seg-btn.active .seg-main');
      const sessionTitle = activeTab ? activeTab.textContent : state.currentDay;
      const now = new Date();
      const dateStr = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

      let logText = `[${dateStr} - ${sessionTitle} 수행 기록]\n`;
      logText += `사이클: #${state.cycleCount} | 1.25kg 원판: ${state.hasMicroPlate ? '보유' : '미보유'}\n\n`;

      let totalLogged = 0;
      let totalCompleted = 0;

      routine.exercises.forEach(ex => {
        const completedSets = ex.sets.filter((_, sIdx) => state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`]);
        totalLogged += ex.sets.length;
        totalCompleted += completedSets.length;

        logText += `• ${ex.name} (${completedSets.length}/${ex.sets.length} 완수)\n`;
        logText += `  설정: ${ex.target}\n`;

        ex.sets.forEach((s, sIdx) => {
          const isDone = !!state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`];
          logText += `  - 세트 ${sIdx + 1}: ${s.label} [${isDone ? '완수' : '미수행'}]\n`;
        });
        logText += '\n';
      });

      logText += `총 진행도: ${totalCompleted}/${totalLogged} 세트 (${Math.round((totalCompleted / totalLogged) * 100)}%)\n`;
      logText += `특이사항: Full ROM, 최하단 1초 정지 및 RIR 1~2 준수`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(logText.trim()).then(() => {
          showModal("복사 완료", "오늘의 운동 수행 기록이 클립보드에 복사되었습니다.\n채팅창에 붙여넣어 피드백을 받아보세요.");
        }).catch(() => {
          fallbackCopy(logText);
        });
      } else {
        fallbackCopy(logText);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text.trim();
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showModal("복사 완료", "오늘의 운동 수행 기록이 클립보드에 복사되었습니다.\n채팅창에 붙여넣어 피드백을 받아보세요.");
      } catch (err) {
        showModal("복사 실패", "클립보드 접근이 제한되었습니다:\n\n" + text);
      }
      document.body.removeChild(ta);
    }

    function completeSessionAndOverload() {
      const routine = getRoutineForDay(state.currentDay);
      const totalSets = routine.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);
      const doneSets = routine.exercises.reduce((acc, ex) => {
        return acc + ex.sets.filter((_, sIdx) => state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`]).length;
      }, 0);

      if (doneSets < totalSets) {
        showModal("세트 미완료", "모든 세트를 완료해야 점진적 과부하가 적용됩니다.");
        return;
      }

      const p = state.progression;
      const stepUpper = state.hasMicroPlate ? 2.5 : 5.0;
      const stepLower = 5.0;
      let logs = [];

      routine.exercises.forEach(ex => {
        const item = p[ex.id];
        if (!item) return;

        if (item.type === 'top_backoff') {
          if (item.topReps < item.maxTopReps) {
            item.topReps += 1;
            logs.push(`• ${ex.name}: 탑세트 목표 +1회 상향 (-> ${item.topReps}회)`);
          } else {
            item.topReps = item.maxTopReps - 2;
            item.topW = parseFloat((item.topW + stepUpper).toFixed(1));
            item.backW = parseFloat((item.backW + stepUpper).toFixed(1));
            logs.push(`• ${ex.name}: 상한 달성! 탑 ${item.topW}kg / 백 ${item.backW}kg (+${stepUpper}kg)`);
          }
        } else if (item.type === 'linear_hybrid') {
          const inc = (ex.id.includes('squat')) ? (state.hasMicroPlate ? 2.5 : 5.0) : stepLower;
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 목표 +1회 상향 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 1;
            item.weight = parseFloat((item.weight + inc).toFixed(1));
            logs.push(`• ${ex.name}: 상한 달성! 본세트 ${item.weight}kg (+${inc}kg)`);
          }
        } else if (item.type === 'super_arms') {
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 슈퍼세트 +1회 상향 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 2;
            item.curlW = parseFloat((item.curlW + stepUpper).toFixed(1));
            item.extW = parseFloat((item.extW + 1.0).toFixed(1));
            logs.push(`• ${ex.name}: 상한 달성! 바벨컬 ${item.curlW}kg / 익스텐션 ${item.extW}kg`);
          }
        } else if (item.type === 'double') {
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 목표 +1회 상향 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 2;
            const inc = item.stepW;
            item.weight = parseFloat((item.weight + inc).toFixed(1));
            logs.push(`• ${ex.name}: 상한 달성! 중량 +${inc}kg (-> ${item.weight}kg × ${item.reps}회)`);
          }
        } else if (item.type === 'reps_only') {
          item.reps += 1;
          logs.push(`• ${ex.name}: 목표 +1회 상향 (-> ${item.reps}회)`);
        }
      });

      advanceToNextDay(logs.join('\n'));
    }

    function completeWithoutOverload() {
      showModal("중량 동결", "현재 중량과 횟수를 유지하고 다음 세션으로 넘어가시겠습니까?", () => {
        advanceToNextDay("• 중량 및 횟수 동결 (다음 사이클 동일 조건 재도전)");
      });
    }

    function advanceToNextDay(summaryLog) {
      const routine = getRoutineForDay(state.currentDay);
      routine.exercises.forEach(ex => {
        ex.sets.forEach((_, sIdx) => {
          delete state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`];
        });
      });

      const order = { 's1': 's2', 's2': 's3', 's3': 's4', 's4': 's1' };
      if (state.currentDay === 's4') {
        state.cycleCount += 1;
        summaryLog += `\n\n[4세션 1순환 완주] 사이클 #${state.cycleCount}가 시작됩니다.`;
      }
      state.currentDay = order[state.currentDay] || 's1';

      stopTimer();
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showModal("세션 완료", summaryLog);
    }

    function selectDay(day) {
      state.currentDay = day;
      save();
      render();
    }

    function toggleMicroPlate() {
      state.hasMicroPlate = !state.hasMicroPlate;
      save();
      render();
    }

    function notifyTimerEnd() {
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [880, 1100].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.2);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.2);
          osc.stop(ctx.currentTime + idx * 0.2 + 0.16);
        });
      } catch (e) {}
    }

    function startRestTimer(seconds, label) {
      if (timerInterval) clearInterval(timerInterval);
      remainingSec = seconds;
      const dock = document.getElementById('timerDock');
      dock.className = 'floating-timer running';
      
      document.getElementById('timerMeta').innerHTML = `<strong>${label}</strong><span>휴식 타이머 작동 중</span>`;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingSec--;
        updateTimerDisplay();
        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          dock.className = 'floating-timer finished';
          document.getElementById('timerDisplay').textContent = "GO";
          document.getElementById('timerMeta').innerHTML = `<strong>휴식 종료</strong><span>다음 세트에 바로 진입하세요</span>`;
          notifyTimerEnd();
        }
      }, 1000);
    }

    function adjustTimer(delta) {
      if (!timerInterval && remainingSec <= 0) {
        if (delta > 0) startRestTimer(delta, '수동 타이머');
        return;
      }
      remainingSec = Math.max(0, remainingSec + delta);
      updateTimerDisplay();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      remainingSec = 0;
      document.getElementById('timerDock').className = 'floating-timer';
      document.getElementById('timerDisplay').textContent = "00:00";
      document.getElementById('timerMeta').innerHTML = `<strong>휴식 타이머 대기</strong><span>세트 완료 터치 시 자동 시작</span>`;
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const s = String(remainingSec % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }

    function promptReset() {
      showModal("데이터 초기화", "모든 증량 기록을 초기 베이스라인으로 리셋하시겠습니까?", () => {
        localStorage.removeItem(STORAGE_KEY);
        state = JSON.parse(JSON.stringify(defaultData));
        stopTimer();
        render();
      });
    }

    render();
  </script>
</body>
