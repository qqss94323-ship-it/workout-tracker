<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HOMEGYM 4-SPLIT & ARMS TRACKER</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #07090e;
      --surface-1: rgba(18, 22, 34, 0.75);
      --surface-2: rgba(28, 35, 52, 0.55);
      --surface-border: rgba(255, 255, 255, 0.09);
      --surface-border-hover: rgba(255, 255, 255, 0.18);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #a855f7;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 60%);
      color: var(--text-main);
      padding: 16px 14px 130px 14px;
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* 상단 헤더 */
    .header-card {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .brand-eyebrow {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 3px;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .header-sub {
      font-size: 0.74rem;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .cycle-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      text-align: right;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
    }
    .header-controls {
      display: flex;
      gap: 5px;
      margin-top: 6px;
      justify-content: flex-end;
    }
    .control-pill {
      background: var(--surface-2);
      border: 1px solid var(--surface-border);
      color: var(--text-sub);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-pill:hover {
      color: #fff;
      border-color: var(--surface-border-hover);
    }

    /* 5분할 네비게이션 탭 */
    .tab-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .tab-item {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(12px);
    }
    .tab-badge {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
      letter-spacing: -0.01em;
    }
    .tab-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-sub);
    }

    .tab-item.active {
      transform: translateY(-2px);
    }
    .tab-item.active[data-day="duty"] {
      border-color: var(--accent-purple);
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3);
    }
    .tab-item.active[data-day="duty"] .tab-title { color: #d8b4fe; }
    
    .tab-item.active[data-day="d1"] {
      border-color: var(--accent-cyan);
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3);
    }
    .tab-item.active[data-day="d1"] .tab-title { color: var(--accent-cyan); }

    .tab-item.active[data-day="d2"] {
      border-color: var(--accent-green);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
    }
    .tab-item.active[data-day="d2"] .tab-title { color: var(--accent-green); }

    .tab-item.active[data-day="d3"] {
      border-color: var(--accent-amber);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
    }
    .tab-item.active[data-day="d3"] .tab-title { color: var(--accent-amber); }

    .tab-item.active[data-day="d4"] {
      border-color: var(--accent-rose);
      background: linear-gradient(180deg, rgba(244, 63, 94, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.3);
    }
    .tab-item.active[data-day="d4"] .tab-title { color: var(--accent-rose); }

    /* 운동 카드 */
    .exercise-card {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    .exercise-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
    }
    .exercise-card.all-completed {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.04);
    }
    .exercise-card.all-completed::before {
      background: var(--accent-green);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .exercise-name {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .tag-cluster {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .badge-pill {
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-rest {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--accent-amber);
    }
    .badge-myo {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #d8b4fe;
    }
    .badge-top {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    .exercise-target {
      font-size: 0.88rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .exercise-plate {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.09);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 9px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .exercise-plate::before {
      content: "⚙";
      font-size: 0.75rem;
    }
    .exercise-note {
      font-size: 0.76rem;
      color: var(--text-sub);
      background: rgba(0, 0, 0, 0.3);
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      line-height: 1.4;
      border-left: 2px solid rgba(255, 255, 255, 0.15);
    }

    /* 세트 그리드 및 버튼 */
    .set-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: 7px;
    }
    .set-box {
      background: var(--surface-2);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 10px 5px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    .set-box:active {
      transform: scale(0.96);
    }
    .set-label-main {
      font-size: 0.78rem;
      font-weight: 800;
      color: #f1f5f9;
      display: block;
    }
    .set-label-sub {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 3px;
      display: block;
    }

    .set-box.topset-style {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.08);
    }
    .set-box.topset-style .set-label-main { color: #bae6fd; }

    .set-box.backoff-style {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
    }
    .set-box.backoff-style .set-label-main { color: #fde68a; }

    .set-box.myo-style {
      border-color: rgba(168, 85, 247, 0.4);
      background: rgba(168, 85, 247, 0.08);
    }
    .set-box.myo-style .set-label-main { color: #e9d5ff; }

    .set-box.done {
      background: var(--accent-green) !important;
      border-color: var(--accent-green) !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .set-box.done .set-label-main { color: #022c22 !important; }
    .set-box.done .set-label-sub { color: rgba(2, 44, 34, 0.8) !important; font-weight: 700; }

    /* 완료 및 프로그레스 */
    .finish-section {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 18px 16px;
      margin-top: 18px;
      text-align: center;
      backdrop-filter: blur(14px);
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-stat {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .btn-action-primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      background: var(--surface-2);
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .btn-action-primary.ready {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #022c22;
      font-weight: 900;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4);
      transform: translateY(-1px);
    }
    .btn-action-secondary {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
      background: transparent;
      color: var(--text-sub);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-action-secondary:hover {
      color: #fff;
      border-color: var(--surface-border-hover);
    }

    /* 가이드 아코디언 */
    details {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 14px;
      backdrop-filter: blur(12px);
    }
    summary {
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      color: #e2e8f0;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::after {
      content: "＋";
      font-size: 0.9rem;
      color: var(--accent-cyan);
    }
    details[open] summary::after {
      content: "－";
    }
    .guide-box {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .guide-row {
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 2px solid var(--accent-cyan);
      font-size: 0.76rem;
      color: var(--text-sub);
      line-height: 1.45;
    }

    /* 플로팅 타이머 독 */
    .timer-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 15, 25, 0.93);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 11px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      margin: 0 auto;
      z-index: 100;
      backdrop-filter: blur(20px);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.8);
    }
    .timer-panel.active { border-top-color: var(--accent-amber); }
    .timer-panel.myo-state { border-top-color: var(--accent-purple); background: rgba(22, 14, 34, 0.95); }
    .timer-panel.done-state { border-top-color: var(--accent-green); background: rgba(6, 30, 20, 0.95); }

    .timer-display-wrap { display: flex; align-items: center; gap: 12px; }
    .timer-clock {
      font-size: 1.7rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--accent-amber);
      min-width: 76px;
      letter-spacing: -0.02em;
    }
    .timer-panel.myo-state .timer-clock { color: #d8b4fe; }
    .timer-panel.done-state .timer-clock { color: var(--accent-green); }

    .timer-info-text {
      font-size: 0.75rem;
      color: var(--text-sub);
      line-height: 1.25;
      max-width: 220px;
    }
    .timer-info-text strong {
      color: #fff;
      font-weight: 700;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timer-btn-cluster { display: flex; gap: 4px; }
    .btn-t {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      background: var(--surface-2);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-t:hover { background: rgba(255, 255, 255, 0.12); }
    .btn-t.danger {
      background: rgba(244, 63, 94, 0.18);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fca5a5;
    }

    /* 모달 */
    .modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .modal-frame {
      background: #111624;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 22px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.8);
    }
    .modal-title { font-size: 1.05rem; font-weight: 900; color: #fff; margin-bottom: 8px; }
    .modal-body-txt { font-size: 0.82rem; color: var(--text-sub); white-space: pre-line; line-height: 1.55; margin-bottom: 18px; }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

  <header class="header-card">
    <div>
      <div class="brand-eyebrow">HYPERTROPHY & BACK-OFF PRO</div>
      <div class="header-title">HOMEGYM 4-SPLIT & ARMS</div>
      <div class="header-sub">3대 420kg 복구 · 탑세트 + 백오프 볼륨 트래커</div>
    </div>
    <div>
      <div class="cycle-badge" id="cycleBadge">사이클 #1</div>
      <div class="header-controls">
        <button class="control-pill" onclick="toggleMicroPlate()" id="microBtn">1.25kg: 보유</button>
        <button class="control-pill" onclick="promptReset()">초기화</button>
      </div>
    </div>
  </header>

  <!-- 5분할 네비게이션 -->
  <nav class="tab-nav">
    <div class="tab-item" data-day="duty" onclick="selectDay('duty')">
      <span class="tab-badge">24h당직</span>
      <span class="tab-title">Arms</span>
    </div>
    <div class="tab-item active" data-day="d1" onclick="selectDay('d1')">
      <span class="tab-badge">비번 1일</span>
      <span class="tab-title">밀기</span>
    </div>
    <div class="tab-item" data-day="d2" onclick="selectDay('d2')">
      <span class="tab-badge">비번 2일</span>
      <span class="tab-title">하체</span>
    </div>
    <div class="tab-item" data-day="d3" onclick="selectDay('d3')">
      <span class="tab-badge">비번 1일</span>
      <span class="tab-title">어깨</span>
    </div>
    <div class="tab-item" data-day="d4" onclick="selectDay('d4')">
      <span class="tab-badge">비번 2일</span>
      <span class="tab-title">당기기</span>
    </div>
  </nav>

  <main id="workoutContainer"></main>

  <!-- 세션 완료 & 과부하 박스 -->
  <section class="finish-section">
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="progress-stat" id="progressStatus">진행률: 0 / 0 세트 완료</div>
    <button class="btn-action-primary" id="finishBtn" onclick="completeSessionAndOverload()">
      모든 세트를 완료하면 점진적 과부하가 켜져
    </button>
    <button class="btn-action-secondary" onclick="completeWithoutOverload()">
      오늘은 중량·횟수 동결하고 다음 세션으로 넘어가기
    </button>
  </section>

  <!-- 세션 가이드 -->
  <details>
    <summary>오늘의 세션 타이밍 & 영양 수칙 보기</summary>
    <div class="guide-box" id="dailyGuideList"></div>
  </details>

  <!-- 하단 플로팅 타이머 -->
  <div class="timer-panel" id="timerDock">
    <div class="timer-display-wrap">
      <div class="timer-clock" id="timerDisplay">00:00</div>
      <div class="timer-info-text" id="timerMeta">
        <strong>세트 대기 중</strong>
        세트 완료 터치 시 휴식 타이머 자동 작동
      </div>
    </div>
    <div class="timer-btn-cluster">
      <button class="btn-t" onclick="adjustTimer(-15)">-15</button>
      <button class="btn-t" onclick="adjustTimer(15)">+15</button>
      <button class="btn-t danger" onclick="stopTimer()">정지</button>
    </div>
  </div>

  <!-- 커스텀 모달 -->
  <div class="modal-scrim" id="modalOverlay">
    <div class="modal-frame">
      <div class="modal-title" id="modalTitle">알림</div>
      <div class="modal-body-txt" id="modalDesc"></div>
      <div class="modal-buttons" id="modalActions">
        <button class="btn-t" style="background:#06b6d4; color:#022c22; font-weight:800; padding:8px 18px;" onclick="closeModal()">확인</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'shiftLiftHomeGym4SplitV5_BackoffPro';

    const defaultData = {
      cycleCount: 1,
      hasMicroPlate: true,
      currentDay: 'd1',
      checkedSets: {},
      progression: {
        // [출근일: Arms 전담 20분]
        duty_incline_curl: { weight: 10.0, reps: 10, maxReps: 12, stepW: 1.0, type: 'double' },
        duty_pushdown_myo: { weight: 20.0, actReps: 12, stepW: 2.5, type: 'myo' },
        duty_hammer_curl: { weight: 10.0, reps: 12, maxReps: 14, stepW: 1.0, type: 'double' },

        // [Day 1: 밀기 - 벤치프레스 탑세트 + 백오프(신장성 통제) 복원]
        d1_bench_combo: {

    function calcPlateText(targetW, barType) {
      if (barType === 'db') return `한손 덤벨 ${targetW}kg`;
      if (barType === 'cable') return `상단 케이블 ${targetW}kg`;
      if (barType === 'body') return `맨몸 (필요 시 파워랙 밴드 보조)`;

      const barW = 20.0; // 15kg 바벨 + 2.5kg 원판 2개 고정 베이스 20kg
      const step = state.hasMicroPlate ? 2.5 : 5.0;
      const actualW = Math.round(targetW / step) * step;

      if (actualW <= barW) return `베이스 바벨 20kg 단독`;
      let side = (actualW - barW) / 2;
      const plates = state.hasMicroPlate ? [20, 15, 10, 5, 2.5, 1.25] : [20, 15, 10, 5, 2.5];
      const counts = {};
      for (let p of plates) {
        while (side >= p - 0.001) {
          counts[p] = (counts[p] || 0) + 1;
          side -= p;
        }
      }
      const str = Object.entries(counts).map(([k, v]) => `${k}kg×${v}`).join(' + ');
      return `한쪽 원판: ${str || '세팅 불가'}`;
    }

                { label: '1라운드 완수', rest: 60, style: '' },

                { label: '3라운드 완수', rest: 60, style: '' }
              ]
            },
            {
              id: 'd3_rear_delt',
              name: '3. 덤벨 리어 델트 플라이 (후면 고립)',
              target: `덤벨 각 ${p.d3_rear_delt.weight}kg × ${p.d3_rear_delt.reps}회 × 3세트`,
              plate: calcPlateText(p.d3_rear_delt.weight, 'db'),
              note: '인클라인 벤치 30도에 엎드려 후면 삼각근으로만 호를 그리며 리프팅',
              rest: 45,
              type: 'standard',
              sets: [
                { label: `1세트 (${p.d3_rear_delt.reps}회)`, rest: 45, style: '' },
                { label: `2세트 (${p.d3_rear_delt.reps}회)`, rest: 45, style: '' },
                { label: `3세트 (${p.d3_rear_delt.reps}회)`, rest: 45, style: '' }
              ]
            }
          ]
        };
      }

      if (day === 'd4') {
        const dl = p.d4_deadlift;
        return {
          themeColor: '#f43f5e',
          guide: [
            "비번 2일차 당기기: 어제 허리를 100% 쉬었으므로 최상의 요추 컨디션으로 155kg 데드 진입",
            "스트랩 필수: 악력 피로를 배제하고 광배근에만 집중하기 위해 모든 종목 스트랩 착용",
            "마이오 렙스 등 운동: 덤벨 로우와 암 풀다운은 15초 마이크로 휴식으로 10분 만에 종료"
          ],
          exercises: [
            {
              id: 'd4_deadlift',
              name: '1. 컨벤셔널 데드리프트 (메인 스트렝스)',
              target: `탑세트 ${dl.weight}kg × ${dl.reps}회 + 백오프 ${dl.backoffW}kg × ${dl.backoffReps}회 2세트`,
              plate: `탑세트: ${calcPlateText(dl.weight, 'barbell')} | 백오프: ${calcPlateText(dl.backoffW, 'barbell')}`,
              note: '10mm 벨트 + 스트랩 착용. 척추 중립을 유지하고 바닥을 밀어내는 레그프레스 큐',
              rest: 180,
              type: 'standard',
              sets: [
                { label: '웜업 70kg×5', rest: 90, style: '' },
                { label: '웜업 110kg×3', rest: 120, style: '' },
                { label: `탑세트 (${dl.reps}회)`, rest: 180, style: 'topset-style' },
                { label: `백오프 1 (${dl.backoffReps}회)`, rest: 120, style: 'backoff-style' },
                { label: `백오프 2 (${dl.backoffReps}회)`, rest: 120, style: 'backoff-style' }
              ]
            },
            {
              id: 'd4_pullup',
              name: '2. 파워랙 풀업 (광배 너비 확장)',
              target: `맨몸(또는 밴드 보조) × ${p.d4_pullup.reps}회 × 3세트`,
              plate: '파워랙 상단 철봉',
              note: '가슴을 바 쪽으로 열어주며 광배근 하부로 수축',
              rest: 90,
              type: 'standard',
              sets: [
                { label: `1세트 (${p.d4_pullup.reps}회)`, rest: 90, style: '' },
                { label: `2세트 (${p.d4_pullup.reps}회)`, rest: 90, style: '' },
                { label: `3세트 (${p.d4_pullup.reps}회)`, rest: 90, style: '' }
              ]
            },
            {
              id: 'd4_chest_db_row_myo',
              name: '3. 체스트 서포티드 덤벨 로우 [마이오 렙스]',
              target: `각 ${p.d4_chest_db_row_myo.weight}kg × 활성화 ${p.d4_chest_db_row_myo.actReps}회 + 미니 3회×3번`,
              plate: calcPlateText(p.d4_chest_db_row_myo.weight, 'db'),
              note: '벤치 30도 가슴 밀착(요추 부담 0%). 활성화 후 15초 쉬고 3회씩 3번 등 상부 수축',
              rest: 15,
              type: 'myo',
              sets: [
                { label: `활성화 (${p.d4_chest_db_row_myo.actReps}회)`, rest: 15, style: 'myo-style' },
                { label: '미니 1 (3회)', rest: 15, style: 'myo-style' },
                { label: '미니 2 (3회)', rest: 15, style: 'myo-style' },
                { label: '미니 3 (3회)', rest: 75, style: 'myo-style' }
              ]
            },
            {
              id: 'd4_arm_pulldown_myo',
              name: '4. 케이블 암 풀다운 [마이오 렙스]',
              target: `${p.d4_arm_pulldown_myo.weight}kg × 활성화 ${p.d4_arm_pulldown_myo.actReps}회 + 미니 3회×3번`,
              plate: calcPlateText(p.d4_arm_pulldown_myo.weight, 'cable'),
              note: '팔꿈치 살짝 굽혀 고정하고 허벅지까지 호를 그리며 광배근 고립 펌핑',
              rest: 15,
              type: 'myo',
              sets: [
                { label: `활성화 (${p.d4_arm_pulldown_myo.actReps}회)`, rest: 15, style: 'myo-style' },
                { label: '미니 1 (3회)', rest: 15, style: 'myo-style' },
                { label: '미니 2 (3회)', rest: 15, style: 'myo-style' },
                { label: '미니 3 (3회)', rest: 60, style: 'myo-style' }
              ]
            }
          ]
        };
      }
    }

    function render() {
      document.getElementById('cycleBadge').textContent = `사이클 #${state.cycleCount}`;
      document.getElementById('microBtn').textContent = `1.25kg: ${state.hasMicroPlate ? '보유' : '미보유'}`;

      document.querySelectorAll('.tab-item').forEach(btn => {
        const d = btn.getAttribute('data-day');
        btn.classList.toggle('active', state.currentDay === d);
      });

      const routine = getRoutineForDay(state.currentDay);
      const container = document.getElementById('workoutContainer');

      let totalSets = 0;
      let doneSets = 0;
      let html = '';

      routine.exercises.forEach(ex => {
        let exAllDone = true;
        let setsHtml = '';

        ex.sets.forEach((sObj, sIdx) => {
          totalSets++;
          const key = `${state.currentDay}_${ex.id}_s${sIdx}`;
          const isDone = !!state.checkedSets[key];
          if (isDone) doneSets++;
          else exAllDone = false;

          const isMyo = sObj.rest === 15;

          setsHtml += `
            <div class="set-box ${sObj.style || ''} ${isDone ? 'done' : ''}" 
                 onclick="toggleSet('${key}', ${sObj.rest}, '${ex.name}', ${isMyo})">
              <span class="set-label-main">${isDone ? '✓ 완수' : sObj.label}</span>
              <span class="set-label-sub">${isDone ? sObj.label : `${sObj.rest}초 휴식`}</span>
            </div>
          `;
        });

        html += `
          <div class="exercise-card ${exAllDone ? 'all-completed' : ''}">
            <div class="card-top">
              <div class="exercise-name">${ex.name}</div>
              <div class="tag-cluster">
                ${ex.type === 'myo' ? '<span class="badge-pill badge-myo">Myo-reps</span>' : ''}
                ${ex.type === 'top_backoff' ? '<span class="badge-pill badge-top">Top+Backoff</span>' : ''}
                <span class="badge-pill badge-rest">휴식 ${ex.rest}s</span>
              </div>
            </div>
            <div class="exercise-target">${ex.target}</div>
            <div class="exercise-plate">${ex.plate}</div>
            <div class="exercise-note">${ex.note}</div>
            <div class="set-matrix">${setsHtml}</div>
          </div>
        `;
      });

      container.innerHTML = html;

      const pct = totalSets > 0 ? (doneSets / totalSets) * 100 : 0;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressBar').style.background = routine.themeColor;
      document.getElementById('progressStatus').textContent = `오늘 진행률: ${doneSets} / ${totalSets} 세트 완료 (${Math.round(pct)}%)`;

      const finishBtn = document.getElementById('finishBtn');
      if (doneSets === totalSets && totalSets > 0) {
        finishBtn.classList.add('ready');
        finishBtn.textContent = "오늘 루틴 완벽 완수! 다음 주기 점진적 과부하(+증량) 적용하기";
      } else {
        finishBtn.classList.remove('ready');
        finishBtn.textContent = `남은 ${totalSets - doneSets}개 세트를 모두 완료하면 활성화돼`;
      }

      document.getElementById('dailyGuideList').innerHTML = routine.guide.map(g => `<div class="guide-row">${g}</div>`).join('');
    }

    function toggleSet(key, restSec, exName, isMyo) {
      state.checkedSets[key] = !state.checkedSets[key];
      save();
      render();
      if (state.checkedSets[key]) {
        startRestTimer(restSec, exName, isMyo);
      }
    }

    function completeSessionAndOverload() {
      const routine = getRoutineForDay(state.currentDay);
      const totalSets = routine.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);
      const doneSets = routine.exercises.reduce((acc, ex) => {
        return acc + ex.sets.filter((_, sIdx) => state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`]).length;
      }, 0);

      if (doneSets < totalSets) {
        showModal("세트 미완료", "아직 체크하지 않은 세트가 남아 있어. 모든 세트를 마쳐야 점진적 과부하가 적용돼!");
        return;
      }

      const p = state.progression;
      const stepBarbell = state.hasMicroPlate ? 2.5 : 5.0;
      let logs = [];

      routine.exercises.forEach(ex => {
        const item = p[ex.id];
        if (!item) return;

        if (item.type === 'top_backoff') {
          if (item.topReps < item.maxTopReps) {
            item.topReps += 1;
            logs.push(`• ${ex.name}: 탑세트 목표 횟수 +1회 상향 (-> ${item.topReps}회)`);
          } else {
            item.topReps = item.maxTopReps - 2;
            item.topW = parseFloat((item.topW + stepBarbell).toFixed(1));
            item.backW = parseFloat((item.backW + stepBarbell).toFixed(1));
            logs.push(`• ${ex.name}: 탑세트 상한 달성! 탑세트 ${item.topW}kg / 백오프 ${item.backW}kg로 +${stepBarbell}kg 증량!`);
          }
        } else if (item.type === 'linear_hybrid') {
          item.weight = parseFloat((item.weight + stepBarbell).toFixed(1));
          item.backoffW = parseFloat((item.backoffW + stepBarbell).toFixed(1));
          logs.push(`• ${ex.name}: 탑세트 ${item.weight}kg / 백오프 ${item.backoffW}kg로 +${stepBarbell}kg 증량!`);
        } else if (item.type === 'myo') {
          if (item.weight !== undefined) {
            const inc = item.stepW;
            item.weight = parseFloat((item.weight + inc).toFixed(1));
            logs.push(`• ${ex.name}: 마이오 렙스 완수! 중량 +${inc}kg 증량 (-> ${item.weight}kg)`);
          }
        } else if (item.type === 'double') {
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 목표 횟수 +1회 상향 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 2;
            if (item.dbW !== undefined && item.cableW !== undefined) {
              item.dbW = parseFloat((item.dbW + 1.0).toFixed(1));
              item.cableW = parseFloat((item.cableW + 2.5).toFixed(1));
              logs.push(`• ${ex.name}: 상한 달성! 사레레 ${item.dbW}kg / 페이스풀 ${item.cableW}kg 증량`);
            } else if (item.dropW !== undefined) {
              item.weight = parseFloat((item.weight + item.stepW).toFixed(1));
              item.dropW = parseFloat((item.dropW + item.stepW).toFixed(1));
              logs.push(`• ${ex.name}: 상한 달성! 본무게 ${item.weight}kg / 드롭 ${item.dropW}kg 증량`);
            } else {
              const inc = (ex.id.includes('rdl')) ? stepBarbell : item.stepW;
              item.weight = parseFloat((item.weight + inc).toFixed(1));
              logs.push(`• ${ex.name}: 상한 횟수 달성! 중량 +${inc}kg 증량 (-> ${item.weight}kg × ${item.reps}회)`);
            }
          }
        } else if (item.type === 'reps_only') {
          item.reps += 1;
          logs.push(`• ${ex.name}: 목표 횟수 +1회 상향 (-> ${item.reps}회)`);
        }
      });

      advanceToNextDay(logs.join('\n'));
    }

    function completeWithoutOverload() {
      showModal("중량/횟수 동결", "오늘 중량과 횟수를 그대로 유지하고 다음 세션으로 넘어갈까?", () => {
        advanceToNextDay("• 중량 및 횟수 동결 (다음 사이클에 동일 조건 재도전)");
      });
    }

    function advanceToNextDay(summaryLog) {
      const routine = getRoutineForDay(state.currentDay);
      routine.exercises.forEach(ex => {
        ex.sets.forEach((_, sIdx) => {
          delete state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`];
        });
      });

      const order = { 'duty': 'd1', 'd1': 'd2', 'd2': 'd3', 'd3': 'd4', 'd4': 'duty' };
      if (state.currentDay === 'd4') {
        state.cycleCount += 1;
        summaryLog += `\n\n🎉 [4분할 1바퀴 완주!] 루틴 사이클 #${state.cycleCount}이 시작돼.`;
      }
      state.currentDay = order[state.currentDay] || 'd1';

      stopTimer();
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showModal("세션 완료 및 다음 주기 세팅", summaryLog);
    }

    function selectDay(day) {
      state.currentDay = day;
      save();
      render();
    }

    function toggleMicroPlate() {
      state.hasMicroPlate = !state.hasMicroPlate;
      save();
      render();
    }

    function notifyTimerEnd() {
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [880, 1100].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.2);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.2);
          osc.stop(ctx.currentTime + idx * 0.2 + 0.16);
        });
      } catch (e) {}
    }

    function startRestTimer(seconds, label, isMyo) {
      if (timerInterval) clearInterval(timerInterval);
      remainingSec = seconds;
      const dock = document.getElementById('timerDock');
      dock.className = isMyo ? 'timer-panel myo-state active' : 'timer-panel active';
      
      const tagText = isMyo ? '<span style="color:#d8b4fe;">[마이오 15초]</span> ' : '';
      document.getElementById('timerMeta').innerHTML = `<strong>${tagText}${label}</strong>휴식 진행 중...`;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingSec--;
        updateTimerDisplay();
        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          dock.className = 'timer-panel done-state';
          document.getElementById('timerDisplay').textContent = "GO!";
          document.getElementById('timerMeta').innerHTML = `<strong>휴식 완료!</strong>다음 세트에 즉시 진입해`;
          notifyTimerEnd();
        }
      }, 1000);
    }

    function adjustTimer(delta) {
      if (!timerInterval && remainingSec <= 0) {
        if (delta > 0) startRestTimer(delta, '수동 타이머', false);
        return;
      }
      remainingSec = Math.max(0, remainingSec + delta);
      updateTimerDisplay();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      remainingSec = 0;
      document.getElementById('timerDock').className = 'timer-panel';
      document.getElementById('timerDisplay').textContent = "00:00";
      document.getElementById('timerMeta').innerHTML = `<strong>세트 대기 중</strong>세트 완료 터치 시 휴식 타이머 자동 작동`;
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const s = String(remainingSec % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }

    function promptReset() {
      showModal("전체 데이터 초기화", "모든 증량 기록을 초기 베이스라인으로 완전히 리셋할까?", () => {
        localStorage.removeItem(STORAGE_KEY);
        state = JSON.parse(JSON.stringify(defaultData));
        stopTimer();
        render();
      });
    }

    render();
  </script>
</body>
</html>
