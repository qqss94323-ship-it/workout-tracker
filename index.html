<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HOMEGYM 4-SPLIT & HYPERTROPHY TRACKER</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #07090e;
      --surface-1: rgba(18, 22, 34, 0.78);
      --surface-2: rgba(28, 35, 52, 0.58);
      --surface-border: rgba(255, 255, 255, 0.09);
      --surface-border-hover: rgba(255, 255, 255, 0.18);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #a855f7;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 60%);
      color: var(--text-main);
      padding: 16px 14px 130px 14px;
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      line-height: 1.5;
    }

    .header-card {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .brand-eyebrow {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 3px;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .header-sub {
      font-size: 0.74rem;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .cycle-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      text-align: right;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
    }
    .header-controls {
      display: flex;
      gap: 5px;
      margin-top: 6px;
      justify-content: flex-end;
    }
    .control-pill {
      background: var(--surface-2);
      border: 1px solid var(--surface-border);
      color: var(--text-sub);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-pill:hover {
      color: #fff;
      border-color: var(--surface-border-hover);
    }

    /* 4세션 순환 네비게이션 탭 */
    .tab-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .tab-item {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(12px);
    }
    .tab-badge {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }
    .tab-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-sub);
    }
    .tab-item.active {
      transform: translateY(-2px);
    }
    .tab-item.active[data-day="s1"] {
      border-color: var(--accent-cyan);
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3);
    }
    .tab-item.active[data-day="s1"] .tab-title { color: var(--accent-cyan); }

    .tab-item.active[data-day="s2"] {
      border-color: var(--accent-blue);
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
    }
    .tab-item.active[data-day="s2"] .tab-title { color: #60a5fa; }

    .tab-item.active[data-day="s3"] {
      border-color: var(--accent-purple);
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3);
    }
    .tab-item.active[data-day="s3"] .tab-title { color: #c084fc; }

    .tab-item.active[data-day="s4"] {
      border-color: var(--accent-green);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.2) 0%, rgba(18, 22, 34, 0.9) 100%);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
    }
    .tab-item.active[data-day="s4"] .tab-title { color: var(--accent-green); }

    /* 운동 카드 */
    .exercise-card {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    .exercise-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
    }
    .exercise-card.all-completed {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.04);
    }
    .exercise-card.all-completed::before {
      background: var(--accent-green);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .exercise-name {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .tag-cluster {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .badge-pill {
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-rest {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--accent-amber);
    }
    .badge-top {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    .exercise-target {
      font-size: 0.88rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .exercise-plate {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.09);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 9px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .exercise-plate::before {
      content: "⚙";
      font-size: 0.75rem;
    }
    .exercise-note {
      font-size: 0.76rem;
      color: var(--text-sub);
      background: rgba(0, 0, 0, 0.3);
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      line-height: 1.45;
      border-left: 2px solid rgba(255, 255, 255, 0.15);
    }

    .set-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 7px;
    }
    .set-box {
      background: var(--surface-2);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 10px 5px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    .set-box:active {
      transform: scale(0.96);
    }
    .set-label-main {
      font-size: 0.78rem;
      font-weight: 800;
      color: #f1f5f9;
      display: block;
    }
    .set-label-sub {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 3px;
      display: block;
    }

    .set-box.topset-style {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.08);
    }
    .set-box.topset-style .set-label-main { color: #bae6fd; }

    .set-box.backoff-style {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
    }
    .set-box.backoff-style .set-label-main { color: #fde68a; }

    .set-box.super-style {
      border-color: rgba(168, 85, 247, 0.4);
      background: rgba(168, 85, 247, 0.08);
    }
    .set-box.super-style .set-label-main { color: #e9d5ff; }

    .set-box.done {
      background: var(--accent-green) !important;
      border-color: var(--accent-green) !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .set-box.done .set-label-main { color: #022c22 !important; }
    .set-box.done .set-label-sub { color: rgba(2, 44, 34, 0.8) !important; font-weight: 700; }

    .finish-section {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 18px 16px;
      margin-top: 18px;
      text-align: center;
      backdrop-filter: blur(14px);
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-stat {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .btn-action-primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      background: var(--surface-2);
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .btn-action-primary.ready {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #022c22;
      font-weight: 900;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4);
      transform: translateY(-1px);
    }
    .btn-action-secondary {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
      background: transparent;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-action-secondary:hover {
      color: #fff;
      border-color: var(--surface-border-hover);
    }
    .btn-action-copy {
      border-color: rgba(6, 182, 212, 0.4);
      color: #38bdf8;
      background: rgba(6, 182, 212, 0.05);
    }
    .btn-action-copy:hover {
      background: rgba(6, 182, 212, 0.12);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    details {
      background: var(--surface-1);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 14px;
      backdrop-filter: blur(12px);
    }
    summary {
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      color: #e2e8f0;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::after {
      content: "＋";
      font-size: 0.9rem;
      color: var(--accent-cyan);
    }
    details[open] summary::after {
      content: "－";
    }
    .guide-box {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .guide-row {
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 2px solid var(--accent-cyan);
      font-size: 0.76rem;
      color: var(--text-sub);
      line-height: 1.45;
    }

    /* 플로팅 타이머 패널 */
    .timer-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 15, 25, 0.93);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 11px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 640px;
      margin: 0 auto;
      z-index: 100;
      backdrop-filter: blur(20px);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.8);
    }
    .timer-panel.active { border-top-color: var(--accent-amber); }
    .timer-panel.done-state { border-top-color: var(--accent-green); background: rgba(6, 30, 20, 0.95); }

    .timer-display-wrap { display: flex; align-items: center; gap: 12px; }
    .timer-clock {
      font-size: 1.7rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--accent-amber);
      min-width: 76px;
      letter-spacing: -0.02em;
    }
    .timer-panel.done-state .timer-clock { color: var(--accent-green); }

    .timer-info-text {
      font-size: 0.75rem;
      color: var(--text-sub);
      line-height: 1.25;
      max-width: 220px;
    }
    .timer-info-text strong {
      color: #fff;
      font-weight: 700;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timer-btn-cluster { display: flex; gap: 4px; }
    .btn-t {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      background: var(--surface-2);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-t:hover { background: rgba(255, 255, 255, 0.12); }
    .btn-t.danger {
      background: rgba(244, 63, 94, 0.18);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fca5a5;
    }

    /* 모달 */
    .modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .modal-frame {
      background: #111624;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 22px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.8);
    }
    .modal-title { font-size: 1.05rem; font-weight: 900; color: #fff; margin-bottom: 8px; }
    .modal-body-txt { font-size: 0.82rem; color: var(--text-sub); white-space: pre-line; line-height: 1.55; margin-bottom: 18px; }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

  <header class="header-card">
    <div>
      <div class="brand-eyebrow">2026 HYPERTROPHY SCIENCE</div>
      <div class="header-title">HOMEGYM 4-SPLIT & ARMS</div>
      <div class="header-sub">Full ROM · 최하단 1초 정지 · RIR 엄격 관리</div>
    </div>
    <div>
      <div class="cycle-badge" id="cycleBadge">사이클 #1</div>
      <div class="header-controls">
        <button class="control-pill" onclick="toggleMicroPlate()" id="microBtn">1.25kg: 보유</button>
        <button class="control-pill" onclick="promptReset()">초기화</button>
      </div>
    </div>
  </header>

  <!-- 4세션 순환 탭 -->
  <nav class="tab-nav">
    <div class="tab-item active" data-day="s1" onclick="selectDay('s1')">
      <span class="tab-badge">Session 1</span>
      <span class="tab-title">Push & 삼두</span>
    </div>
    <div class="tab-item" data-day="s2" onclick="selectDay('s2')">
      <span class="tab-badge">Session 2</span>
      <span class="tab-title">Pull & 이두</span>
    </div>
    <div class="tab-item" data-day="s3" onclick="selectDay('s3')">
      <span class="tab-badge">Session 3</span>
      <span class="tab-title">프레임 & 팔</span>
    </div>
    <div class="tab-item" data-day="s4" onclick="selectDay('s4')">
      <span class="tab-badge">Session 4</span>
      <span class="tab-title">하체 방어</span>
    </div>
  </nav>

  <main id="workoutContainer"></main>

  <section class="finish-section">
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="progress-stat" id="progressStatus">진행률: 0 / 0 세트 완료</div>
    
    <button class="btn-action-primary" id="finishBtn" onclick="completeSessionAndOverload()">
      모든 본세트를 완료하면 점진적 과부하가 켜집니다
    </button>
    
    <!-- 수행 기록 복사 버튼 -->
    <button class="btn-action-secondary btn-action-copy" onclick="copyWorkoutLog()">
      📋 오늘 수행 기록 텍스트 복사하기
    </button>

    <button class="btn-action-secondary" onclick="completeWithoutOverload()">
      오늘은 중량·횟수 동결하고 다음 세션으로 넘어가기
    </button>
  </section>

  <details>
    <summary>오늘의 세션 원칙 & 큐 (2025-2026 Science)</summary>
    <div class="guide-box" id="dailyGuideList"></div>
  </details>

  <!-- 플로팅 타이머 -->
  <div class="timer-panel" id="timerDock">
    <div class="timer-display-wrap">
      <div class="timer-clock" id="timerDisplay">00:00</div>
      <div class="timer-info-text" id="timerMeta">
        <strong>세트 대기 중</strong>
        세트 완료 터치 시 휴식 타이머 자동 작동
      </div>
    </div>
    <div class="timer-btn-cluster">
      <button class="btn-t" onclick="adjustTimer(-15)">-15</button>
      <button class="btn-t" onclick="adjustTimer(15)">+15</button>
      <button class="btn-t danger" onclick="stopTimer()">정지</button>
    </div>
  </div>

  <!-- 모달 -->
  <div class="modal-scrim" id="modalOverlay">
    <div class="modal-frame">
      <div class="modal-title" id="modalTitle">알림</div>
      <div class="modal-body-txt" id="modalDesc"></div>
      <div class="modal-buttons" id="modalActions">
        <button class="btn-t" style="background:#06b6d4; color:#022c22; font-weight:800; padding:8px 18px;" onclick="closeModal()">확인</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'homegym_4split_science_v2026';

    const defaultData = {
      cycleCount: 1,
      hasMicroPlate: true,
      currentDay: 's1',
      checkedSets: {},
      progression: {
        // [Session 1: 상체 Push & 삼두]
        s1_low_incline_bench: {
          topW: 77.5, topReps: 6, maxTopReps: 8,
          backW: 70.0, backReps: 8, maxBackReps: 10,
          stepW: 2.5, type: 'top_backoff'
        },
        s1_incline_db_press: { weight: 24.0, reps: 8, maxReps: 10, stepW: 2.0, type: 'double' },
        s1_lateral_raise: { weight: 5.0, reps: 12, maxReps: 15, stepW: 1.0, type: 'double' },
        s1_lying_tri_ext: { weight: 25.0, reps: 10, maxReps: 12, stepW: 2.5, type: 'double' },
        s1_cable_pushdown: { weight: 20.0, reps: 12, maxReps: 15, stepW: 2.5, type: 'double' },

        // [Session 2: 상체 Pull & 이두]
        s2_barbell_row: {
          topW: 77.5, topReps: 6, maxTopReps: 8,
          backW: 70.0, backReps: 8, maxBackReps: 10,
          stepW: 2.5, type: 'top_backoff'
        },
        s2_body_pullup: { reps: 8, maxReps: 10, stepW: 0, type: 'reps_only' },
        s2_one_arm_row: { weight: 28.0, reps: 10, maxReps: 12, stepW: 2.0, type: 'double' },

    function calcPlateText(targetW, type) {
      if (type === 'db') return `한손 덤벨 ${targetW}kg`;
      if (type === 'cable') return `케이블 스택 ${targetW}kg`;
      if (type === 'body') return `맨몸 (필요 시 스트랩/밴드 보조)`;

      const barW = 20.0;
      const step = state.hasMicroPlate ? 2.5 : 5.0;
      const actualW = Math.round(targetW / step) * step;

      if (actualW <= barW) return `베이스 바벨 20kg 단독`;
      let side = (actualW - barW) / 2;
      const plates = state.hasMicroPlate ? [20, 15, 10, 5, 2.5, 1.25] : [20, 15, 10, 5, 2.5];
      const counts = {};
      for (let p of plates) {
        while (side >= p - 0.001) {
          counts[p] = (counts[p] || 0) + 1;
          side -= p;
        }
      }
      const str = Object.entries(counts).map(([k, v]) => `${k}kg×${v}`).join(' + ');
      return `한쪽 원판: ${str || '세팅 불가'}`;
    }

              name: '5. 시티드 덤벨 해머 컬 (상완근·전완근)',
              target: `덤벨 각 ${p.s3_hammer_curl.weight}kg × ${p.s3_hammer_curl.reps}회 × 2세트`,
              plate: calcPlateText(p.s3_hammer_curl.weight, 'db'),
              note: '상완근을 두껍게 만들어 상완 둘레 확장. 엄지손가락을 천장으로 올리며 컨트롤.',
              rest: 60,
              type: 'standard',
              sets: [
                { label: `1세트 (${p.s3_hammer_curl.reps}회)`, rest: 60, style: '' },
                { label: `2세트 (${p.s3_hammer_curl.reps}회)`, rest: 60, style: '' }
              ]
            }
          ]
        };
      }

      if (day === 's4') {
        const sq = p.s4_squat_str;
        const dl = p.s4_deadlift_str;
        return {
          themeColor: '#10b981',
          guide: [
            "세션 목표: 3대 380kg 완벽 방어 및 저볼륨 집중 하체 (45~50분)",
            "정크 볼륨 0%: 스쿼트 3세트, 데드리프트 2세트로 스트렝스 신경계만 확실히 자극",
            "가동 범위(Full ROM): 스쿼트는 고관절이 무릎 아래로 내려가는 깊이 통제",
            "러닝 주의: 하체 세션 전후 24시간 동안은 Zone 2 야외 러닝 금지 (신경계 피로 분리)"
          ],
          exercises: [
            {
              id: 's4_squat_str',
              name: '1. 바벨 백스쿼트 (3대 스트렝스 방어)',
              target: `${sq.weight}kg × ${sq.reps}회 × 3세트 (Full ROM)`,
              plate: calcPlateText(sq.weight, 'barbell'),
              note: '10mm 리프팅 벨트 착용. 최하단 깊이 통제 후 반동 없이 일어남 (RPE 8, RIR 1~2 엄수).',
              rest: 150,
              type: 'standard',
              sets: [
                { label: '웜업 60kg×5', rest: 90, style: '' },
                { label: '웜업 85kg×3', rest: 120, style: '' },
                { label: `1세트 (${sq.weight}kg × ${sq.reps}회)`, rest: 150, style: 'topset-style' },
                { label: `2세트 (${sq.weight}kg × ${sq.reps}회)`, rest: 150, style: 'topset-style' },
                { label: `3세트 (${sq.weight}kg × ${sq.reps}회)`, rest: 150, style: 'topset-style' }
              ]
            },
            {
              id: 's4_deadlift_str',
              name: '2. 컨벤셔널 / 루마니안 데드리프트',
              target: `${dl.weight}kg × ${dl.reps}회 × 2세트 (폭발적 힌지)`,
              plate: calcPlateText(dl.weight, 'barbell'),
              note: '스트랩 착용. 바닥을 발로 밀어내는 레그프레스 큐. 척추 중립 고정, RIR 1~2.',
              rest: 180,
              type: 'standard',
              sets: [
                { label: '웜업 70kg×5', rest: 90, style: '' },
                { label: '웜업 100kg×3', rest: 120, style: '' },
                { label: `1세트 (${dl.weight}kg × ${dl.reps}회)`, rest: 180, style: 'topset-style' },
                { label: `2세트 (${dl.weight}kg × ${dl.reps}회)`, rest: 180, style: 'topset-style' }
              ]
            },
            {
              id: 's4_db_leg_curl',
              name: '3. 덤벨 레그 컬 (평벤치 엎드려 수행)',
              target: `발 사이 덤벨 ${p.s4_db_leg_curl.weight}kg × ${p.s4_db_leg_curl.reps}회 × 2세트`,
              plate: calcPlateText(p.s4_db_leg_curl.weight, 'db'),
              note: '발 사이에 덤벨을 끼우고 엎드려 네거티브 3초 통제. 햄스트링 단독 수축/신장.',
              rest: 75,
              type: 'standard',
              sets: [
                { label: `1세트 (${p.s4_db_leg_curl.reps}회)`, rest: 75, style: '' },
                { label: `2세트 (${p.s4_db_leg_curl.reps}회)`, rest: 75, style: '' }
              ]
            },
            {
              id: 's4_hanging_leg_raise',
              name: '4. 파워랙 행잉 레그레이즈',
              target: `맨몸 × ${p.s4_hanging_leg_raise.reps}회 × 3세트`,
              plate: '철봉 매달리기 (코어/복압 강화)',
              note: '골반을 명치 쪽으로 말아올리며 하복부 자극. 척추 감압 효과 병행.',
              rest: 60,
              type: 'standard',
              sets: [
                { label: `1세트 (${p.s4_hanging_leg_raise.reps}회)`, rest: 60, style: '' },
                { label: `2세트 (${p.s4_hanging_leg_raise.reps}회)`, rest: 60, style: '' },
                { label: `3세트 (${p.s4_hanging_leg_raise.reps}회)`, rest: 60, style: '' }
              ]
            }
          ]
        };
      }
    }

    function render() {
      document.getElementById('cycleBadge').textContent = `사이클 #${state.cycleCount}`;
      document.getElementById('microBtn').textContent = `1.25kg: ${state.hasMicroPlate ? '보유' : '미보유'}`;

      document.querySelectorAll('.tab-item').forEach(btn => {
        const d = btn.getAttribute('data-day');
        btn.classList.toggle('active', state.currentDay === d);
      });

      const routine = getRoutineForDay(state.currentDay);
      const container = document.getElementById('workoutContainer');

      let totalSets = 0;
      let doneSets = 0;
      let html = '';

      routine.exercises.forEach(ex => {
        let exAllDone = true;
        let setsHtml = '';

        ex.sets.forEach((sObj, sIdx) => {
          totalSets++;
          const key = `${state.currentDay}_${ex.id}_s${sIdx}`;
          const isDone = !!state.checkedSets[key];
          if (isDone) doneSets++;
          else exAllDone = false;

          setsHtml += `
            <div class="set-box ${sObj.style || ''} ${isDone ? 'done' : ''}" 
                 onclick="toggleSet('${key}', ${sObj.rest}, '${ex.name}')">
              <span class="set-label-main">${isDone ? '✓ 완수' : sObj.label}</span>
              <span class="set-label-sub">${isDone ? sObj.label : `${sObj.rest}초 휴식`}</span>
            </div>
          `;
        });

        html += `
          <div class="exercise-card ${exAllDone ? 'all-completed' : ''}">
            <div class="card-top">
              <div class="exercise-name">${ex.name}</div>
              <div class="tag-cluster">
                ${ex.type === 'top_backoff' ? '<span class="badge-pill badge-top">Top+Backoff</span>' : ''}
                <span class="badge-pill badge-rest">휴식 ${ex.rest}s</span>
              </div>
            </div>
            <div class="exercise-target">${ex.target}</div>
            <div class="exercise-plate">${ex.plate}</div>
            <div class="exercise-note">${ex.note}</div>
            <div class="set-matrix">${setsHtml}</div>
          </div>
        `;
      });

      container.innerHTML = html;

      const pct = totalSets > 0 ? (doneSets / totalSets) * 100 : 0;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressBar').style.background = routine.themeColor;
      document.getElementById('progressStatus').textContent = `오늘 진행률: ${doneSets} / ${totalSets} 세트 완료 (${Math.round(pct)}%)`;

      const finishBtn = document.getElementById('finishBtn');
      if (doneSets === totalSets && totalSets > 0) {
        finishBtn.classList.add('ready');
        finishBtn.textContent = "오늘 루틴 완벽 완수! 다음 주기 점진적 과부하(+증량) 적용하기";
      } else {
        finishBtn.classList.remove('ready');
        finishBtn.textContent = `남은 ${totalSets - doneSets}개 세트를 모두 완료하면 활성화됩니다`;
      }

      document.getElementById('dailyGuideList').innerHTML = routine.guide.map(g => `<div class="guide-row">${g}</div>`).join('');
    }

    function toggleSet(key, restSec, exName) {
      state.checkedSets[key] = !state.checkedSets[key];
      save();
      render();
      if (state.checkedSets[key]) {
        startRestTimer(restSec, exName);
      }
    }

    /* 수행 기록 클립보드 복사 함수 */
    function copyWorkoutLog() {
      const routine = getRoutineForDay(state.currentDay);
      const activeTab = document.querySelector('.tab-item.active .tab-title');
      const sessionTitle = activeTab ? activeTab.textContent : state.currentDay;
      const now = new Date();
      const dateStr = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

      let logText = `[${dateStr} - ${sessionTitle} 수행 기록]\n`;
      logText += `사이클: #${state.cycleCount} | 1.25kg 원판: ${state.hasMicroPlate ? '보유' : '미보유'}\n\n`;

      let totalLogged = 0;
      let totalCompleted = 0;

      routine.exercises.forEach(ex => {
        const completedSets = ex.sets.filter((_, sIdx) => state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`]);
        totalLogged += ex.sets.length;
        totalCompleted += completedSets.length;

        logText += `• ${ex.name} (${completedSets.length}/${ex.sets.length} 완수)\n`;
        logText += `  설정: ${ex.target}\n`;

        ex.sets.forEach((s, sIdx) => {
          const isDone = !!state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`];
          logText += `  - 세트 ${sIdx + 1}: ${s.label} [${isDone ? '완수' : '미수행'}]\n`;
        });
        logText += '\n';
      });

      logText += `총 진행도: ${totalCompleted}/${totalLogged} 세트 (${Math.round((totalCompleted / totalLogged) * 100)}%)\n`;
      logText += `특이사항: Full ROM, 최하단 1초 정지 및 RIR 1~2 준수`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(logText.trim()).then(() => {
          showModal("복사 완료", "오늘의 운동 수행 기록이 클립보드에 복사되었습니다!\n채팅창에 붙여넣어 피드백을 받아보세요.");
        }).catch(() => {
          fallbackCopy(logText);
        });
      } else {
        fallbackCopy(logText);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text.trim();
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showModal("복사 완료", "오늘의 운동 수행 기록이 클립보드에 복사되었습니다!\n채팅창에 붙여넣어 피드백을 받아보세요.");
      } catch (err) {
        showModal("복사 실패", "클립보드 접근이 제한되었습니다. 텍스트를 직접 복사해주세요:\n\n" + text);
      }
      document.body.removeChild(ta);
    }

    function completeSessionAndOverload() {
      const routine = getRoutineForDay(state.currentDay);
      const totalSets = routine.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);
      const doneSets = routine.exercises.reduce((acc, ex) => {
        return acc + ex.sets.filter((_, sIdx) => state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`]).length;
      }, 0);

      if (doneSets < totalSets) {
        showModal("세트 미완료", "아직 완료되지 않은 세트가 있습니다. 모든 세트를 마쳐야 점진적 과부하가 적용됩니다.");
        return;
      }

      const p = state.progression;
      const stepUpper = state.hasMicroPlate ? 2.5 : 5.0;
      const stepLower = 5.0;
      let logs = [];

      routine.exercises.forEach(ex => {
        const item = p[ex.id];
        if (!item) return;

        if (item.type === 'top_backoff') {
          if (item.topReps < item.maxTopReps) {
            item.topReps += 1;
            logs.push(`• ${ex.name}: 탑세트 목표 횟수 +1회 상향 (-> ${item.topReps}회)`);
          } else {
            item.topReps = item.maxTopReps - 2;
            item.topW = parseFloat((item.topW + stepUpper).toFixed(1));
            item.backW = parseFloat((item.backW + stepUpper).toFixed(1));
            logs.push(`• ${ex.name}: 탑세트 횟수 상한 달성! 탑 ${item.topW}kg / 백오프 ${item.backW}kg (+${stepUpper}kg 증량)`);
          }
        } else if (item.type === 'linear_hybrid') {
          const inc = (ex.id.includes('squat')) ? (state.hasMicroPlate ? 2.5 : 5.0) : stepLower;
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 목표 횟수 +1회 상향 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 1;
            item.weight = parseFloat((item.weight + inc).toFixed(1));
            logs.push(`• ${ex.name}: 목표 횟수 상한 달성! 본세트 ${item.weight}kg로 +${inc}kg 증량!`);
          }
        } else if (item.type === 'super_arms') {
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 슈퍼세트 횟수 +1회 상향 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 2;
            item.curlW = parseFloat((item.curlW + stepUpper).toFixed(1));
            item.extW = parseFloat((item.extW + 1.0).toFixed(1));
            logs.push(`• ${ex.name}: 슈퍼세트 상한 달성! 바벨컬 ${item.curlW}kg / 익스텐션 ${item.extW}kg로 증량`);
          }
        } else if (item.type === 'double') {
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 목표 횟수 +1회 상향 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 2;
            const inc = item.stepW;
            item.weight = parseFloat((item.weight + inc).toFixed(1));
            logs.push(`• ${ex.name}: 횟수 상한 달성! 중량 +${inc}kg 증량 (-> ${item.weight}kg × ${item.reps}회)`);
          }
        } else if (item.type === 'reps_only') {
          item.reps += 1;
          logs.push(`• ${ex.name}: 목표 횟수 +1회 상향 (-> ${item.reps}회)`);
        }
      });

      advanceToNextDay(logs.join('\n'));
    }

    function completeWithoutOverload() {
      showModal("중량/횟수 동결", "오늘 중량과 횟수를 그대로 유지하고 다음 세션으로 넘어가시겠습니까?", () => {
        advanceToNextDay("• 중량 및 횟수 동결 (다음 사이클에 동일 조건 재도전)");
      });
    }

    function advanceToNextDay(summaryLog) {
      const routine = getRoutineForDay(state.currentDay);
      routine.exercises.forEach(ex => {
        ex.sets.forEach((_, sIdx) => {
          delete state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`];
        });
      });

      const order = { 's1': 's2', 's2': 's3', 's3': 's4', 's4': 's1' };
      if (state.currentDay === 's4') {
        state.cycleCount += 1;
        summaryLog += `\n\n🎉 [4세션 1순환 완주!] 루틴 사이클 #${state.cycleCount}가 시작됩니다.`;
      }
      state.currentDay = order[state.currentDay] || 's1';

      stopTimer();
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showModal("세션 완료 및 다음 순환 세팅", summaryLog);
    }

    function selectDay(day) {
      state.currentDay = day;
      save();
      render();
    }

    function toggleMicroPlate() {
      state.hasMicroPlate = !state.hasMicroPlate;
      save();
      render();
    }

    function notifyTimerEnd() {
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [880, 1100].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.2);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.2);
          osc.stop(ctx.currentTime + idx * 0.2 + 0.16);
        });
      } catch (e) {}
    }

    function startRestTimer(seconds, label) {
      if (timerInterval) clearInterval(timerInterval);
      remainingSec = seconds;
      const dock = document.getElementById('timerDock');
      dock.className = 'timer-panel active';
      
      document.getElementById('timerMeta').innerHTML = `<strong>${label}</strong>휴식 진행 중...`;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingSec--;
        updateTimerDisplay();
        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          dock.className = 'timer-panel done-state';
          document.getElementById('timerDisplay').textContent = "GO!";
          document.getElementById('timerMeta').innerHTML = `<strong>휴식 완료!</strong>다음 세트에 즉시 진입하세요.`;
          notifyTimerEnd();
        }
      }, 1000);
    }

    function adjustTimer(delta) {
      if (!timerInterval && remainingSec <= 0) {
        if (delta > 0) startRestTimer(delta, '수동 타이머');
        return;
      }
      remainingSec = Math.max(0, remainingSec + delta);
      updateTimerDisplay();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      remainingSec = 0;
      document.getElementById('timerDock').className = 'timer-panel';
      document.getElementById('timerDisplay').textContent = "00:00";
      document.getElementById('timerMeta').innerHTML = `<strong>세트 대기 중</strong>세트 완료 터치 시 휴식 타이머 자동 작동`;
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const s = String(remainingSec % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }

    function promptReset() {
      showModal("전체 데이터 초기화", "모든 증량 기록을 초기 베이스라인으로 완전히 리셋하시겠습니까?", () => {
        localStorage.removeItem(STORAGE_KEY);
        state = JSON.parse(JSON.stringify(defaultData));
        stopTimer();
        render();
      });
    }

    render();
  </script>
</body>
