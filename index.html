<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HOMEGYM 4-SPLIT & ARMS TRACKER</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --box: #222731;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
      --purple: #8b5cf6;
      --red: #ef4444;
      --border: #2d3340;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 12px 12px 115px 12px; max-width: 660px; margin: 0 auto; line-height: 1.45; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
    .title { font-size: 1.15rem; font-weight: 800; color: #fff; }
    .sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .cycle-badge { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 4px 9px; border-radius: 6px; font-size: 0.76rem; font-weight: 700; display: inline-block; }

    /* 5개 탭: 당직 팔 + 4분할 */
    .day-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 14px; }
    .tab { padding: 8px 3px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--muted); cursor: pointer; line-height: 1.25; }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .tab.active.duty { background: var(--purple); border-color: var(--purple); }

    /* 운동 카드 */
    .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; transition: border-color 0.2s; }
    .ex-card.done-card { border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.05); }
    .ex-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .ex-name { font-size: 0.96rem; font-weight: 700; color: #fff; }
    .ex-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
    .tag-rest { background: var(--box); color: var(--amber); }
    .tag-myo { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.4); }
    .ex-target { font-size: 0.88rem; font-weight: 700; color: #60a5fa; margin-bottom: 5px; }
    .ex-plate { font-size: 0.75rem; color: #34d399; background: rgba(16, 185, 129, 0.1); padding: 5px 8px; border-radius: 5px; margin-bottom: 8px; display: inline-block; font-weight: 600; }
    .ex-note { font-size: 0.76rem; color: var(--muted); margin-bottom: 10px; }

    /* 세트 버튼 그리드 */
    .set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(82px, 1fr)); gap: 7px; }
    .set-btn { padding: 9px 5px; background: var(--box); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.78rem; font-weight: 700; text-align: center; cursor: pointer; transition: 0.15s; user-select: none; }
    .set-btn.myo-btn { border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.1); }
    .set-btn.completed { background: var(--green); border-color: var(--green); color: #052e16; }
    .set-btn span { display: block; font-size: 0.68rem; font-weight: 500; opacity: 0.85; margin-top: 2px; }

    /* 완료 및 점진적 과부하 박스 */
    .finish-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; text-align: center; margin-top: 14px; }
    .progress-status { font-size: 0.86rem; font-weight: 700; margin-bottom: 10px; color: var(--muted); }
    .btn-finish { width: 100%; padding: 13px; border-radius: 8px; border: none; font-size: 0.92rem; font-weight: 800; cursor: pointer; background: var(--box); color: var(--muted); transition: 0.2s; }
    .btn-finish.ready { background: var(--green); color: #052e16; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }

    details { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
    summary { font-size: 0.86rem; font-weight: 700; cursor: pointer; color: var(--text); }
    .simple-list { margin-top: 10px; font-size: 0.78rem; color: var(--muted); }
    .simple-list div { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    /* 하단 고정 타이머 바 */
    .timer-dock { position: fixed; bottom: 0; left: 0; right: 0; background: #14171f; border-top: 2px solid var(--border); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; max-width: 660px; margin: 0 auto; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.6); }
    .timer-dock.running { border-top-color: var(--amber); }
    .timer-dock.myo { border-top-color: var(--purple); background: #1b152b; }
    .timer-dock.finished { border-top-color: var(--green); background: #0c261c; }
    .timer-left { display: flex; align-items: center; gap: 10px; }
    .timer-time { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--amber); min-width: 72px; }
    .timer-dock.myo .timer-time { color: #c4b5fd; }
    .timer-label { font-size: 0.76rem; color: var(--muted); line-height: 1.25; }
    .timer-controls { display: flex; gap: 5px; }
    .t-btn { padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--box); color: var(--text); font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .t-btn.stop { background: var(--red); border-color: var(--red); color: #fff; }

    /* 커스텀 모달 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 440px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .modal-title { font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .modal-desc { font-size: 0.82rem; color: var(--muted); white-space: pre-line; line-height: 1.5; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div>
      <div class="title">HOMEGYM 4-SPLIT & ARMS</div>
      <div class="sub">근비대·마이오 렙스 & 무통증 자극 중심 루틴</div>
    </div>
    <div style="text-align:right;">
      <div class="cycle-badge" id="cycleBadge">루틴 사이클 #1</div>
      <div style="margin-top:4px; display:flex; gap:5px; justify-content:flex-end;">
        <button class="t-btn" style="padding:3px 6px; font-size:0.68rem;" onclick="toggleMicroPlate()" id="microBtn">1.25kg원판: 보유</button>
        <button class="t-btn" style="padding:3px 6px; font-size:0.68rem;" onclick="promptReset()">초기화</button>
      </div>
    </div>
  </header>

  <!-- 5개 탭: 출근일 Arms + 4분할 -->
  <div class="day-tabs">
    <div class="tab" id="tab-duty" onclick="selectDay('duty')">출근일<br><span style="font-size:0.64rem; font-weight:500;">Arms</span></div>
    <div class="tab active" id="tab-d1" onclick="selectDay('d1')">Day 1<br><span style="font-size:0.64rem; font-weight:500;">밀기</span></div>
    <div class="tab" id="tab-d2" onclick="selectDay('d2')">Day 2<br><span style="font-size:0.64rem; font-weight:500;">하체</span></div>
    <div class="tab" id="tab-d3" onclick="selectDay('d3')">Day 3<br><span style="font-size:0.64rem; font-weight:500;">어깨</span></div>
    <div class="tab" id="tab-d4" onclick="selectDay('d4')">Day 4<br><span style="font-size:0.64rem; font-weight:500;">당기기</span></div>
  </div>

  <main id="workoutContainer"></main>

  <section class="finish-box">
    <div class="progress-status" id="progressStatus">진행률: 0 / 0 세트 완료</div>
    <button class="btn-finish" id="finishBtn" onclick="completeSessionAndOverload()">
      모든 세트를 체크하면 점진적 과부하가 활성화됩니다
    </button>
    <button class="t-btn" style="margin-top:8px; width:100%;" onclick="completeWithoutOverload()">
      오늘은 중량/횟수 유지하고 다음 세션으로 넘어가기
    </button>
  </section>

  <details>
    <summary>오늘의 세션 타이밍·영양 핵심 수칙 보기 (터치)</summary>
    <div class="simple-list" id="dailyGuideList"></div>
  </details>

  <!-- 하단 고정 타이머 바 -->
  <div class="timer-dock" id="timerDock">
    <div class="timer-left">
      <div class="timer-time" id="timerDisplay">00:00</div>
      <div class="timer-label" id="timerStatusText">세트 버튼을 누르면<br>휴식 타이머가 자동 시작됩니다</div>
    </div>
    <div class="timer-controls">
      <button class="t-btn" onclick="adjustTimer(-15)">-15초</button>
      <button class="t-btn" onclick="adjustTimer(15)">+15초</button>
      <button class="t-btn stop" onclick="stopTimer()">정지</button>
    </div>
  </div>

  <!-- 커스텀 모달 UI -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">알림</div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-actions" id="modalActions">
        <button class="t-btn" style="background:var(--blue); color:#fff; padding:8px 16px;" onclick="closeModal()">확인</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'shiftLiftHomeGym4SplitV3_Myo';

    const defaultData = {
      cycleCount: 1,
      hasMicroPlate: true,
      currentDay: 'd1',
      checkedSets: {},
      progression: {
        // [출근일: Arms 전담 20분 세션]
        duty_incline_curl: { weight: 10.0, reps: 10, maxReps: 12, stepW: 1.0, type: 'double' },
        duty_pushdown_myo: { weight: 20.0, actReps: 12, stepW: 2.5, type: 'myo' },
        duty_hammer_curl: { weight: 10.0, reps: 12, maxReps: 14, stepW: 1.0, type: 'double' },

        // [Day 1: 밀기 - 벤치 마이오 렙스 30분 세션]
        d1_bench_myo: { weight: 77.5, actReps: 9, stepW: 2.5, type: 'myo' },
        d1_incline_db_rp: { weight: 20.0, reps: 8, maxReps: 10, stepW: 2.0, type: 'double' },
        d1_db_fly: { weight: 10.0, reps: 10, maxReps: 12, stepW: 2.0, type: 'double' },
        d1_side_raise_drop: { weight: 8.0, dropW: 6.0, reps: 12, maxReps: 15, stepW: 1.0, type: 'double' },

        // [Day 2: 하체 - 사두 직격 & 요추/전완 보호 세션]
        d2_squat: { weight: 105.0, reps: 3, backoffW: 90.0, backoffReps: 8, stepW: 2.5, type: 'linear_hybrid' },
        d2_rdl: { weight: 90.0, reps: 8, maxReps: 10, stepW: 2.5, type: 'double' },
        d2_db_squat: { weight: 16.0, reps: 10, maxReps: 12, stepW: 2.0, type: 'double' },
        d2_leg_raise: { reps: 12, maxReps: 15, stepW: 0, type: 'reps_only' },

        // [Day 3: 어깨 - 뇌압 안전·입체감 세션 (요추 부하 0%)]
        d3_seated_db_press: { weight: 16.0, reps: 8, maxReps: 10, stepW: 2.0, type: 'double' },
        d3_ss_delt: { dbW: 6.0, cableW: 15.0, reps: 12, maxReps: 15, stepW: 1.0, type: 'double' },
        d3_rear_delt: { weight: 8.0, reps: 12, maxReps: 15, stepW: 1.0, type: 'double' },

        // [Day 4: 당기기 - 등 전체 너비/두께]
        d4_deadlift: { weight: 155.0, reps: 2, backoffW: 130.0, backoffReps: 5, stepW: 2.5, type: 'linear_hybrid' },
        d4_pullup: { reps: 6, maxReps: 8, stepW: 0, type: 'reps_only' },
        d4_chest_db_row_myo: { weight: 18.0, actReps: 10, stepW: 2.0, type: 'myo' },
        d4_arm_pulldown_myo: { weight: 20.0, actReps: 12, stepW: 2.5, type: 'myo' }
      }
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultData));
    let timerInterval = null;
    let remainingSec = 0;

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showModal(title, desc, confirmCallback = null) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      const actions = document.getElementById('modalActions');
      if (confirmCallback) {
        actions.innerHTML = `
          <button class="t-btn" onclick="closeModal()">취소</button>
          <button class="t-btn" style="background:var(--red); color:#fff;" id="modalConfirmBtn">확인</button>
        `;
        document.getElementById('modalConfirmBtn').onclick = () => {
          closeModal();
          confirmCallback();
        };
      } else {
        actions.innerHTML = `<button class="t-btn" style="background:var(--blue); color:#fff; padding:8px 16px;" onclick="closeModal()">확인</button>`;
      }
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function calcPlateText(targetW, barType) {
      if (barType === 'db') return `한손 덤벨 ${targetW}kg`;
      if (barType === 'cable') return `상단 케이블 ${targetW}kg`;
      if (barType === 'body') return `맨몸 (필요 시 파워랙 밴드 보조)`;

      const barW = 20.0; // 15kg 바벨 + 2.5kg 원판 2개 고정 베이스
      const step = state.hasMicroPlate ? 2.5 : 5.0;
      const actualW = Math.round(targetW / step) * step;

      if (actualW <= barW) return `기본 베이스 바벨 ${barW}kg 단독`;
      let side = (actualW - barW) / 2;
      const plates = state.hasMicroPlate ? [20, 15, 10, 5, 2.5, 1.25] : [20, 15, 10, 5, 2.5];
      const counts = {};
      for (let p of plates) {
        while (side >= p - 0.001) {
          counts[p] = (counts[p] || 0) + 1;
          side -= p;
        }
      }
      const str = Object.entries(counts).map(([k, v]) => `${k}kg×${v}`).join(' + ');
      return `한쪽 원판(베이스 20kg 바): ${str || '구성 불가'}`;
    }

    function getRoutineForDay(day) {
      const p = state.progression;

      if (day === 'duty') {
        return {
          guide: [
            "• [당직 근무일 Arms 20분] 척추·요추 압박 및 복강 내압(발살바) 0% 유지",
            "• [템포] 3-0-1 통제 (이완 3초, 수축 1초 / 반동 엄금)",
            "• [푸쉬다운 마이오 렙스] 활성화 세트 후 15초(호흡 5회)만 쉬고 3회씩 3번 연속 타격",
            "• [야간 단식] 22:00 이후 정제 탄수화물(라면류) 0g 엄수, 미온수 2.5L 충분히 섭취"
          ],
          exercises: [
            {
              id: 'duty_incline_curl',
              name: '1. 인클라인 덤벨 컬 (이두 장두 신장)',
              target: `덤벨 각 ${p.duty_incline_curl.weight}kg × ${p.duty_incline_curl.reps}회 × 3세트`,
              plate: calcPlateText(p.duty_incline_curl.weight, 'db'),
              note: '벤치 60도 세팅. 팔꿈치를 몸통 뒤에 고정하고 네거티브 3초 통제',
              rest: 60,
              type: 'standard',
              sets: [
                { label: `1세트 (${p.duty_incline_curl.reps}회)`, rest: 60 },
                { label: `2세트 (${p.duty_incline_curl.reps}회)`, rest: 60 },
                { label: `3세트 (${p.duty_incline_curl.reps}회)`, rest: 60 }
              ]
            },
            {
              id: 'duty_pushdown_myo',
              name: '2. 케이블 트라이셉스 푸쉬다운 [마이오 렙스]',
              target: `${p.duty_pushdown_myo.weight}kg × 활성화 ${p.duty_pushdown_myo.actReps}회 + 미니 3회×3번`,
              plate: calcPlateText(p.duty_pushdown_myo.weight, 'cable'),
              note: '활성화 후 15초 마이크로 휴식(심호흡 5회) 후 3회씩 끊어 치며 외측두 완전 펌핑',
              rest: 15,
              type: 'myo',
              sets: [
                { label: `활성화 (${p.duty_pushdown_myo.actReps}회)`, rest: 15 },
                { label: '미니 1 (3회)', rest: 15 },
                { label: '미니 2 (3회)', rest: 15 },
                { label: '미니 3 (3회)', rest: 60 }
              ]
            },
            {
              id: 'duty_hammer_curl',
              name: '3. 시티드 덤벨 해머컬 (상완근·전완)',
              target: `덤벨 각 ${p.duty_hammer_curl.weight}kg × ${p.duty_hammer_curl.reps}회 × 3세트`,
              plate: calcPlateText(p.duty_hammer_curl.weight, 'db'),
              note: '벤치에 바르게 앉아 치팅 없이 엄지손가락을 천장 방향으로 리프팅',
              rest: 45,
              type: 'standard',
              sets: [
                { label: `1세트 (${p.duty_hammer_curl.reps}회)`, rest: 45 },
                { label: `2세트 (${p.duty_hammer_curl.reps}회)`, rest: 45 },
                { label: `3세트 (${p.duty_hammer_curl.reps}회)`, rest: 45 }
              ]
            }
          ]
        };
      }

      if (day === 'd1') {
        const bm = p.d1_bench_myo;
        return {
          guide: [
            "• [비번 1일차 밀기] 1차 수면 후 기상 즉시 바나나 1개 + 꿀물 + 미온수 섭취",
            "• [관절 보호] 100kg 단발성 고중량 배제! 77.5kg 네거티브 2초 통제 및 마이오 렙스로 가슴 근비대 집중",
            "• [인클라인 덤벨 RP] 8회 완수 직후 15초 쉬고 3회, 다시 15초 쉬고 2~3회로 1세트 종결 (세션 25분 단축)"
          ],
          exercises: [
            {
              id: 'd1_bench_myo',
              name: '1. 바벨 벤치프레스 [마이오 렙스 전용]',
              target: `활성화 ${bm.weight}kg × ${bm.actReps}회 (RPE 8.5) + 미니 3회×3번`,
              plate: calcPlateText(bm.weight, 'barbell'),
              note: '웜업 후 활성화 세트 진행. 거치 후 15초만 쉬고 3회씩 3번 연속 수행 (관절 통증 0% 달성)',
              rest: 15,
              type: 'myo',
              sets: [
                { label: '웜업 20kg×10', rest: 60 },
                { label: '웜업 50kg×5', rest: 75 },
                { label: `활성화 ${bm.weight}kg×${bm.actReps}`, rest: 15 },
                { label: '미니 1 (3회)', rest: 15 },
                { label: '미니 2 (3회)', rest: 15 },
                { label: '미니 3 (3회)', rest: 90 }
              ]
            },
            {
              id: 'd1_incline_db_rp',
              name: '2. 인클라인 덤벨 프레스 [레스트-포즈]',

    function render() {
      document.getElementById('cycleBadge').textContent = `루틴 사이클 #${state.cycleCount}`;
      document.getElementById('microBtn').textContent = `1.25kg원판: ${state.hasMicroPlate ? '보유' : '없음(5kg단위)'}`;

      ['duty', 'd1', 'd2', 'd3', 'd4'].forEach(d => {
        const el = document.getElementById(`tab-${d}`);
        if (el) {
          el.classList.toggle('active', state.currentDay === d);
          if (d === 'duty') el.classList.toggle('duty', state.currentDay === 'duty');
        }
      });

      const routine = getRoutineForDay(state.currentDay);
      const container = document.getElementById('workoutContainer');

      let totalSets = 0;
      let doneSets = 0;
      let html = '';

      routine.exercises.forEach(ex => {
        let exAllDone = true;
        let setsHtml = '';

        ex.sets.forEach((sObj, sIdx) => {
          totalSets++;
          const key = `${state.currentDay}_${ex.id}_s${sIdx}`;
          const isDone = !!state.checkedSets[key];
          if (isDone) doneSets++;
          else exAllDone = false;

          const isMyoSet = sObj.rest === 15;

          setsHtml += `
            <div class="set-btn ${isMyoSet ? 'myo-btn' : ''} ${isDone ? 'completed' : ''}" 
                 onclick="toggleSet('${key}', ${sObj.rest}, '${ex.name}', ${isMyoSet})">
              ${isDone ? '✓ 완료' : sObj.label}
              <span>${isDone ? sObj.label : `${sObj.rest}초 휴식`}</span>
            </div>
          `;
        });

        html += `
          <div class="ex-card ${exAllDone ? 'done-card' : ''}">
            <div class="ex-header">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-tags">
                ${ex.type === 'myo' ? '<div class="tag tag-myo">Myo-reps</div>' : ''}
                <div class="tag tag-rest">세트 간 ${ex.rest}초</div>
              </div>
            </div>
            <div class="ex-target">${ex.target}</div>
            <div class="ex-plate">${ex.plate}</div>
            <div class="ex-note">${ex.note}</div>
            <div class="set-grid">${setsHtml}</div>
          </div>
        `;
      });

      container.innerHTML = html;

      const statusEl = document.getElementById('progressStatus');
      const finishBtn = document.getElementById('finishBtn');
      statusEl.textContent = `오늘 진행률: ${doneSets} / ${totalSets} 세트 완료`;

      if (doneSets === totalSets && totalSets > 0) {
        finishBtn.classList.add('ready');
        finishBtn.textContent = "오늘 루틴 완벽 수행! 다음 주기 점진적 과부하(+증량) 적용하기";
      } else {
        finishBtn.classList.remove('ready');
        finishBtn.textContent = `남은 ${totalSets - doneSets}개 세트를 모두 체크하면 완료 버튼이 켜집니다`;
      }

      document.getElementById('dailyGuideList').innerHTML = routine.guide.map(g => `<div>${g}</div>`).join('');
    }

    function toggleSet(key, restSec, exName, isMyo) {
      state.checkedSets[key] = !state.checkedSets[key];
      save();
      render();
      if (state.checkedSets[key]) {
        startRestTimer(restSec, exName, isMyo);
      }
    }

    function completeSessionAndOverload() {
      const routine = getRoutineForDay(state.currentDay);
      const totalSets = routine.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);
      const doneSets = routine.exercises.reduce((acc, ex) => {
        return acc + ex.sets.filter((_, sIdx) => state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`]).length;
      }, 0);

      if (doneSets < totalSets) {
        showModal("세트 미완료", "아직 체크하지 않은 세트가 남아 있어. 모든 세트를 완료해야 점진적 과부하가 적용돼!");
        return;
      }

      const p = state.progression;
      const stepBarbell = state.hasMicroPlate ? 2.5 : 5.0;
      let logs = [];

      routine.exercises.forEach(ex => {
        const item = p[ex.id];
        if (!item) return;

        if (item.type === 'linear_hybrid') {
          item.weight = parseFloat((item.weight + stepBarbell).toFixed(1));
          item.backoffW = parseFloat((item.backoffW + stepBarbell).toFixed(1));
          logs.push(`• ${ex.name}: 탑세트 ${item.weight}kg / 백오프 ${item.backoffW}kg로 +${stepBarbell}kg 증량!`);
        } else if (item.type === 'myo') {
          if (item.weight !== undefined) {
            const inc = (ex.id.includes('bench')) ? stepBarbell : item.stepW;
            item.weight = parseFloat((item.weight + inc).toFixed(1));
            logs.push(`• ${ex.name}: 마이오 렙스 완수! 중량 +${inc}kg 증량 (-> ${item.weight}kg)`);
          }
        } else if (item.type === 'double') {
          if (item.reps < item.maxReps) {
            item.reps += 1;
            logs.push(`• ${ex.name}: 목표 횟수 +1회 상향 (-> ${item.reps}회)`);
          } else {
            item.reps = item.maxReps - 2;
            if (item.dbW !== undefined && item.cableW !== undefined) {
              item.dbW = parseFloat((item.dbW + 1.0).toFixed(1));
              item.cableW = parseFloat((item.cableW + 2.5).toFixed(1));
              logs.push(`• ${ex.name}: 상한 달성! 사레레 ${item.dbW}kg / 페이스풀 ${item.cableW}kg 증량`);
            } else if (item.dropW !== undefined) {
              item.weight = parseFloat((item.weight + item.stepW).toFixed(1));
              item.dropW = parseFloat((item.dropW + item.stepW).toFixed(1));
              logs.push(`• ${ex.name}: 상한 달성! 본무게 ${item.weight}kg / 드롭 ${item.dropW}kg 증량`);
            } else {
              const inc = (ex.id.includes('rdl')) ? stepBarbell : item.stepW;
              item.weight = parseFloat((item.weight + inc).toFixed(1));
              logs.push(`• ${ex.name}: 상한 횟수 달성! 중량 +${inc}kg 증량 (-> ${item.weight}kg × ${item.reps}회)`);
            }
          }
        } else if (item.type === 'reps_only') {
          item.reps += 1;
          logs.push(`• ${ex.name}: 목표 횟수 +1회 증량 (-> ${item.reps}회)`);
        }
      });

      advanceToNextDay(logs.join('\n'));
    }

    function completeWithoutOverload() {
      showModal("중량/횟수 동결", "오늘 중량과 횟수를 그대로 유지하고 다음 세션으로 넘어갈까?", () => {
        advanceToNextDay("• 중량 및 횟수 동결 (다음 사이클에 동일 조건 재도전)");
      });
    }

    function advanceToNextDay(summaryLog) {
      const routine = getRoutineForDay(state.currentDay);
      routine.exercises.forEach(ex => {
        ex.sets.forEach((_, sIdx) => {
          delete state.checkedSets[`${state.currentDay}_${ex.id}_s${sIdx}`];
        });
      });

      // 자연스러운 교대 순환: duty(출근) -> d1(밀기) -> d2(하체) -> d3(어깨) -> d4(당기기) -> duty
      const order = { 'duty': 'd1', 'd1': 'd2', 'd2': 'd3', 'd3': 'd4', 'd4': 'duty' };
      if (state.currentDay === 'd4') {
        state.cycleCount += 1;
        summaryLog += `\n\n[루틴 1바퀴 완주!] 사이클 #${state.cycleCount}이 시작됩니다.`;
      }
      state.currentDay = order[state.currentDay] || 'd1';

      stopTimer();
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showModal("세션 완료 및 다음 주기 세팅", summaryLog);
    }

    function selectDay(day) {
      state.currentDay = day;
      save();
      render();
    }

    function toggleMicroPlate() {
      state.hasMicroPlate = !state.hasMicroPlate;
      save();
      render();
    }

    function notifyTimerEnd() {
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [880, 1100].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.2);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.2);
          osc.stop(ctx.currentTime + idx * 0.2 + 0.16);
        });
      } catch (e) {}
    }

    function startRestTimer(seconds, label, isMyo) {
      if (timerInterval) clearInterval(timerInterval);
      remainingSec = seconds;
      const dock = document.getElementById('timerDock');
      dock.className = isMyo ? 'timer-dock myo running' : 'timer-dock running';
      
      const tagText = isMyo ? '<span style="color:#c4b5fd;">[마이오 15초]</span> ' : '';
      document.getElementById('timerStatusText').innerHTML = `<strong>${tagText}${label}</strong><br>휴식 진행 중...`;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        remainingSec--;
        updateTimerDisplay();
        if (remainingSec <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          dock.className = 'timer-dock finished';
          document.getElementById('timerDisplay').textContent = "GO!";
          document.getElementById('timerStatusText').innerHTML = `<strong>휴식 완료!</strong><br>다음 세트 즉시 진입`;
          notifyTimerEnd();
        }
      }, 1000);
    }

    function adjustTimer(delta) {
      if (!timerInterval && remainingSec <= 0) {
        if (delta > 0) startRestTimer(delta, '수동 타이머', false);
        return;
      }
      remainingSec = Math.max(0, remainingSec + delta);
      updateTimerDisplay();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      remainingSec = 0;
      document.getElementById('timerDock').className = 'timer-dock';
      document.getElementById('timerDisplay').textContent = "00:00";
      document.getElementById('timerStatusText').innerHTML = "세트 버튼을 누르면<br>휴식 타이머가 자동 시작됩니다";
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const s = String(remainingSec % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }

    function promptReset() {
      showModal("전체 데이터 초기화", "모든 증량 기록을 초기 베이스라인으로 완전히 리셋할까?", () => {
        localStorage.removeItem(STORAGE_KEY);
        state = JSON.parse(JSON.stringify(defaultData));
        stopTimer();
        render();
      });
    }

    render();
  </script>
</body>
</html>
